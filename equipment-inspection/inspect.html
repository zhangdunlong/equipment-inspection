<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>点检作业</title>
<link rel="stylesheet" href="/assets/v2/theme.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%231e3a5f'/%3E%3Cpath%20d='M16%206l2.5%205.2%205.6%200.8-4%204%201%205.6L16%2019l-5.1%202.6%201-5.6-4-4%205.6-0.8z'%20fill='%23ffffff'/%3E%3C/svg%3E">
<script src="/assets/v2/core.js"></script>
<script src="/assets/dept.js"></script>
<script src="/assets/sig.js"></script>
<style>
/* ==========================================================================
   屏幕态：v2 设计系统（深蓝灰工业风）
   打印态：完全沿用 v1 已调好的 A4 横版规则（见文件末尾 @media print）
   —— 打印相关的类名与 DOM 结构不做改动，保证每台设备每月正好一页
   ========================================================================== */

/* ---------- 工具条 ---------- */
.toolbar { display:flex; align-items:center; gap:var(--s-3); flex-wrap:wrap;
  padding:var(--s-3) var(--s-4); margin-bottom:var(--s-4);
  background:var(--bg-2); border:1px solid var(--line-1); border-radius:var(--r-lg); }
.toolbar .field { gap:4px; }
.toolbar .field > label { font-size:var(--fs-xs); }
.toolbar .sep { width:1px; height:24px; background:var(--line-1); }

/* ---------- 设备组合框（可搜索 + 键盘可达） ---------- */
.combo { position:relative; }
.combo-input { min-height:34px; }
.combo-list {
  position:absolute; z-index:70; left:0; right:0; top:calc(100% + 4px);
  max-height:290px; overflow:auto; padding:4px;
  background:var(--bg-3); border:1px solid var(--line-2); border-radius:var(--r-md);
  box-shadow:var(--sh-3);
}
.combo-list[hidden] { display:none; }
.combo-opt { display:block; width:100%; text-align:left; padding:7px 10px; border-radius:var(--r-sm);
  background:transparent; border:none; color:var(--tx-1); font-size:var(--fs-sm); }
.combo-opt:hover, .combo-opt.active { background:var(--accent-soft); }
.combo-opt .n { font-weight:700; }
.combo-opt .m { color:var(--tx-3); margin-left:6px; }
.combo-empty { padding:14px; text-align:center; color:var(--tx-3); font-size:var(--fs-sm); }

/* ---------- 状态摘要条 ---------- */
.sumbar { display:flex; align-items:center; gap:var(--s-4); flex-wrap:wrap;
  padding:var(--s-3) var(--s-4); margin-bottom:var(--s-4);
  background:var(--bg-2); border:1px solid var(--line-1); border-radius:var(--r-lg); font-size:var(--fs-sm); }
.sumbar .i { display:flex; align-items:baseline; gap:6px; }
.sumbar .i i { font-style:normal; color:var(--tx-3); }
.sumbar .i b { font-size:var(--fs-lg); font-variant-numeric:tabular-nums; }

/* ---------- 未保存提示 ---------- */
.dirty { display:none; }
.dirty.on { display:flex; }

/* ---------- 点检表容器（白底，贴近纸质单据） ---------- */
.sheet { background:#fff; color:#1a1a2e; border-radius:var(--r-lg); padding:var(--s-4); }
.sheet .dh-code, .sheet .print-code { color:#888; }

.dev-header{ position:relative; background:#fff; border:2px solid #000; border-radius:8px; padding:12px 16px; margin-top:14px; }
.dh-title{ text-align:center; font-size:18px; font-weight:800; letter-spacing:2px; margin-bottom:4px; }
.dh-title .en{ font-size:10px; color:#666; letter-spacing:.5px; display:block; }
.dh-meta{ display:flex; flex-wrap:wrap; gap:6pt 20pt; align-items:center; font-size:13px; border-top:1.5px solid #ddd; border-bottom:1.5px solid #ddd; padding:6pt 0; margin-top:4pt; }
.dh-meta b{ font-weight:700; border-bottom:1px solid #999; padding:0 6pt; min-width:36px; display:inline-block; text-align:center; }

.grid-wrap{ margin-top:10px; border:2px solid #000; border-radius:8px; overflow:auto; background:#fff; }
.mtable{ border-collapse:collapse; width:100%; min-width:980px; font-size:12px; table-layout:fixed; }
.mtable th,.mtable td{ border:1px solid #ccc; padding:3px 2px; text-align:center; vertical-align:middle; }
.mtable thead th{ background:#f3f3f3; font-weight:700; color:#222; font-size:10.5px; }
.mtable .c-sn{ width:34px; }
.mtable .c-content{ width:170px; text-align:left !important; white-space:pre-line; line-height:1.15; font-size:11.5px; }
.mtable .c-content-monthly{ text-align:center !important; }
.mtable .c-freq{ width:46px; font-size:10px; color:#666; }
.mtable .c-day{ width:30px; font-size:10px; }
.mtable .c-day .dow{ display:block; font-size:8px; color:#aaa; font-weight:400; }
.mtable tbody td.sn{ font-weight:700; background:#fafafa; }
.mcell{ cursor:pointer; font-size:13px; font-weight:700; user-select:none; transition:background .1s; }
.mcell:hover{ background:#eef4ff; }
.mcell.ok{ color:#0a8f3c; }
.mcell.ng{ color:#d11; background:#fdeaea; }
.mcell.holiday{ color:#b8860b; background:#fff8e1; }
.mcell.empty{ color:#ccc; }
.mcell.future{ color:#ccc; cursor:not-allowed; background:#fafafa; }
.mcell.auto-slash{ background:#f7f7f7; color:#9a9a9a; }
.mcell-monthly{ background:#f0f7ff !important; font-size:14px !important; text-align:center !important; }
.mlegend{ font-size:11px; color:#888; margin-top:4pt; }
.mlegend b{ color:#333; }
.wk-hint{ font-size:11.5px; color:#8a6d1b; background:#fff8e1; border:1px solid #f0e0a8; border-radius:6px; padding:5px 9px; margin-top:6px; }
.wk-hint b{ color:#6b5200; }
.del-hint{ font-size:11.5px; color:#8c3b3b; background:#fdf0f0; border:1px solid #f2d0d0; border-radius:6px; padding:5px 9px; margin-top:6px; }
.del-hint b{ color:#a02020; }
.sigdel-demo{ display:inline-block; width:14px; height:14px; line-height:13px; border-radius:50%;
  background:#e57373; color:#fff; font-size:10px; font-weight:700; text-align:center; vertical-align:-2px; }
.mtable .sigrow td.sn{ background:#f3f3f3; font-weight:700; }
.mtable .sigrow .c-content{ font-size:10px; }
.sigcell{ position:relative; vertical-align:middle; height:78px; padding:2px 1px; text-align:center; cursor:pointer; }
.sigcell:hover{ background:#eef4ff; }
.sigthumb{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); transform-origin:center; max-width:28px; max-height:72px; }
.sph{ font-size:11px; color:#ccc; }
.sigcell.struck{ cursor:default; background:#fafafa; }
.sigcell.struck:hover{ background:#fafafa; }
.sigslash{ font-size:15px; font-weight:700; color:#b8860b; }
.sigdel{ position:absolute; top:1px; right:2px; z-index:3; width:15px; height:15px; line-height:14px;
  border-radius:50%; background:#e57373; color:#fff; font-size:11px; font-weight:700; text-align:center;
  cursor:pointer; opacity:.55; transition:opacity .12s,transform .12s; user-select:none; }
.sigcell:hover .sigdel{ opacity:1; transform:scale(1.15); }
.sigdel:hover{ background:#d11; opacity:1; }
.sigcell:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }

/* ---------- 签名区 / 异常区（屏幕态） ---------- */
.sig-ops{ background:var(--bg-2); border:1px solid var(--line-1); border-radius:var(--r-lg); margin-top:var(--s-4); padding:var(--s-4); }
.so-title{ font-weight:700; margin-bottom:var(--s-3); font-size:var(--fs-md); color:var(--tx-1); }
.so-meta{ display:flex; gap:var(--s-3); flex-wrap:wrap; align-items:center; }
.so-meta select, .so-meta input { max-width:240px; }
.so-prev{ margin-top:var(--s-3); }
.so-prev img{ max-height:44px; border:1px solid var(--line-2); border-radius:var(--r-sm); background:#fff; padding:2px 6px; vertical-align:middle; }
.sig-line{ margin-top:var(--s-3); padding-top:var(--s-3); border-top:1px dashed var(--line-1); font-size:var(--fs-md); color:var(--tx-2); }
#s_sigprev img{ height:38px; }

.abn-section{ margin-top:var(--s-4); border:1px solid var(--line-2); border-radius:var(--r-lg); padding:var(--s-4); background:var(--bg-2); }
.abn-section .abn-h{ font-weight:800; font-size:var(--fs-md); margin-bottom:var(--s-3); color:#ff9aa0; }
.abn-empty{ color:var(--tx-3); font-size:var(--fs-sm); padding:6px 0; }
.abn-table{ width:100%; border-collapse:collapse; font-size:var(--fs-sm); }
.abn-table th,.abn-table td{ border:1px solid var(--line-1); padding:6px 8px; vertical-align:top; text-align:left; }
.abn-table th{ background:var(--bg-3); font-weight:700; color:var(--tx-2); }
.abn-table .c-sn{ width:44px; } .abn-table .c-abn{ width:200px; } .abn-table .c-handle{ width:200px; }
.abn-table .c-person{ width:90px; } .abn-table .c-hdate{ width:130px; }
.abn-table .ac{ font-size:var(--fs-sm); color:var(--tx-2); }
.abn-input{ width:100%; font-size:var(--fs-sm); padding:5px 7px; border:1px solid var(--line-2);
  border-radius:var(--r-sm); box-sizing:border-box; font-family:inherit; background:var(--bg-1); color:var(--tx-1); }
textarea.abn-input{ min-height:52px; resize:vertical; }
.abn-input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.print-only{ display:none; }
.note-line{ margin-top:var(--s-3); font-size:var(--fs-sm); color:var(--tx-2); line-height:1.6; }
.actions{ margin-top:var(--s-4); display:flex; gap:var(--s-3); flex-wrap:wrap; }

/* ---------- 一键点检（管理员） ---------- */
.batch-list { max-height:420px; overflow:auto; }

/* ==========================================================================
   打印：整月一张 A4 横页（与 v1 完全一致，勿改）
   ========================================================================== */
.print-code{ display:none; }
.dev-header .dh-code{ position:absolute; right:8mm; top:5mm; font-size:8pt; color:#888; font-weight:600; letter-spacing:.5px; pointer-events:none; }
@media print {
@page { size: A4 landscape; margin: 5mm 6mm; }
.print-code{ display:block; text-align:right; font-size:8pt; color:#333; font-weight:600; letter-spacing:.5px; margin-bottom:1pt; padding-right:1mm; }
* { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
body{ background:#fff !important; color:#000 !important; margin:0!important; padding:0!important; min-height:0!important; height:auto!important; overflow:visible!important; }
html{ margin:0!important; padding:0!important; min-height:0!important; height:auto!important; }
.app-nav,.toolbar,.tabs,.sumbar,.banner,.toast-host,.no-print,.combo-list,
.sig-ops .so-meta,.sig-ops .so-prev,.sig-ops .so-title,canvas,input[type=file],
.actions,.mlegend,.sig-ops{ display:none !important; }
.page{ max-width:none!important; margin:0!important; padding:0!important; }
.sheet{ background:transparent!important; padding:0!important; border-radius:0!important; }
.dev-block{ display:block; page-break-inside:avoid; break-inside:avoid; }
.dev-header{ border:1.5px solid #000!important; border-radius:0!important; box-shadow:none!important; page-break-inside:avoid; color:#000!important;
  font-family:"SimSun","宋体","Microsoft YaHei",serif!important; margin-top:0!important; padding:2pt 6pt!important; }
.dh-title{ font-size:12pt!important; font-weight:800!important; letter-spacing:3pt!important; padding:0!important; margin:0!important; }
.dh-title .en{ font-size:7pt!important; color:#333!important; }
.dev-header .dh-code{ display:none!important; }
.dh-meta{ border-top:1.5px solid #000!important; border-bottom:1.5px solid #000!important; font-size:8pt!important; padding:1pt 0!important; margin-top:2pt!important; line-height:1.25!important; }
.dh-meta b{ border-bottom:1px solid #000!important; color:#000!important; }
.grid-wrap{ border:1.5px solid #000!important; border-radius:0!important; box-shadow:none!important; page-break-inside:avoid; break-inside:avoid; color:#000!important;
  font-family:"SimSun","宋体","Microsoft YaHei",serif!important; margin-top:2pt!important; display:block; overflow:visible!important; }
.mtable{ min-width:0!important; font-size:6.5pt!important; width:100%!important; height:auto!important; border-collapse:collapse!important; table-layout:fixed!important; page-break-inside:avoid; break-inside:avoid; }
.mtable th,.mtable td{ border:1px solid #000!important; color:#000!important; padding:.3pt 1pt!important; }
.mtable thead th{ background:#eee!important; padding:.8pt 1pt!important; font-size:6pt; }
.mtable tbody td{ vertical-align:middle!important; height:18pt; box-sizing:border-box; }
.mtable .c-sn{ width:14pt!important; font-size:6pt; }
.mtable .c-content{ width:210pt!important; font-size:6pt!important; line-height:1.1!important; white-space:nowrap!important; overflow:hidden!important; }
.mtable .c-freq{ width:20pt!important; font-size:5.5pt!important; }
.mtable .c-day{ width:15pt!important; font-size:6pt; }
.mtable .sigrow{ margin-top:0!important; }
.mtable .sigrow td{ height:22pt!important; padding:0!important; overflow:hidden!important; }
.mtable .sigrow .sigcell{ padding:0!important; text-align:center!important; vertical-align:middle!important; line-height:0!important; overflow:hidden!important; }
.mtable .sigrow .sigthumb{
  display:inline-block!important; position:static!important; top:auto!important; left:auto!important; transform:none!important;
  margin:0 auto!important; padding:0!important; vertical-align:middle!important;
  width:10pt!important; height:13pt!important; max-width:10pt!important; max-height:13pt!important;
  object-fit:contain!important; object-position:center center!important;
  border:0!important; outline:0!important; background:transparent!important; }
.mtable .sigrow .sph{ display:none!important; }
.mcell{ font-size:7pt!important; }
.mcell.ok{ color:#000!important; } .mcell.ng{ color:#000!important; font-weight:bold!important; }
.mcell.holiday{ color:#000!important; } .mcell-monthly{ text-align:center!important; }
.mtable .c-content-monthly{ text-align:center !important; }
.sig-ops{ display:none !important; }
.sig-line{ display:none !important; }
#abn_zone{ display:none !important; }
#abn_print{ display:block !important; }
.abn-section{ border:1.5px solid #000!important; border-radius:0!important; margin-top:4pt!important; padding:3pt 5pt!important;
  page-break-inside:avoid; break-inside:avoid; font-family:"SimSun","宋体",serif!important; color:#000!important; background:transparent!important; }
.abn-section .abn-h{ font-size:9.5pt!important; font-weight:800!important; margin-bottom:2pt!important; color:#000!important; }
.abn-table{ font-size:6.5pt!important; width:100%!important; border-collapse:collapse!important; }
.abn-table th,.abn-table td{ border:1px solid #000!important; color:#000!important; padding:.6pt 2pt!important; vertical-align:top!important; text-align:left!important; }
.abn-table th{ background:#eee!important; }
.abn-table .ac{ font-size:6pt!important; }
.abn-empty{ color:#000!important; font-size:7pt!important; }
.note-line{ margin-top:3pt!important; font-size:6.5pt!important; color:#000!important; font-family:"SimSun","宋体",serif!important; }
.sigdel{ display:none !important; }
.wk-hint,.del-hint,.mlegend{ display:none !important; }
}
</style>
</head>
<body>

<nav class="app-nav" data-nav>
  <div class="brand"><span class="brand-text">设备点检系统</span></div>
  <div class="sp"></div>
  <span class="ver" data-appver></span>
  <button class="nav-toggle" aria-label="展开菜单" aria-expanded="false">☰</button>
  <div class="links"></div>
</nav>

<div class="page">

  <!-- ================= 工具条 ================= -->
  <div class="toolbar" id="tb">
    <div class="field" style="max-width:200px">
      <label for="f_room">房间</label>
      <select id="f_room"></select>
    </div>
    <div class="field combo" style="min-width:260px;flex:1">
      <label for="f_dev">设备（输入编号 / 名称筛选，↑↓ 选择，Enter 确认）</label>
      <input type="text" id="f_dev" class="input combo-input" autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="devlist" placeholder="🔍 输入编号或名称…">
      <div class="combo-list" id="devlist" role="listbox" hidden></div>
    </div>
    <div class="field" style="max-width:170px">
      <label for="f_month">月份</label>
      <input type="month" id="f_month">
    </div>
    <div class="sep"></div>
    <a class="btn btn-sm btn-ghost" id="go_env">🌡 温湿度表</a>
    <a class="btn btn-sm btn-ghost" id="go_all">🖨 批量打印</a>
  </div>

  <div id="alert"></div>

  <!-- ================= 一键点检（仅管理员） ================= -->
  <div class="panel" id="p_batch" hidden>
    <div class="panel-head"><h2>⚡ 一键点检 · 全部设备（当日）</h2><span class="sp"></span>
      <span class="sm muted">默认全部标记「正常」并一次性签名；需标记异常请在下方勾选并填写说明</span></div>
    <div class="panel-pad">
      <div class="row">
        <div class="field" style="max-width:180px"><label>点检日期</label><input type="date" id="b_date"></div>
        <div class="field" style="max-width:200px"><label>签名人</label><select id="b_signer"></select></div>
        <div class="field" style="max-width:200px" id="b_pw_box"><label>签名密码</label><input type="password" id="b_pw" placeholder="签名人密码"></div>
      </div>
      <div class="flex mt-3 mb-3">
        <button class="btn btn-primary" id="b_go">⚡ 一键点检所有设备（当日）</button>
        <span class="sm muted" id="b_stat"></span>
      </div>
      <div class="table-wrap batch-list">
        <table class="tbl"><thead><tr><th style="width:90px">编号</th><th>设备</th><th style="width:100px">型号</th>
          <th style="width:88px">标记异常</th><th>异常说明</th></tr></thead><tbody id="b_list"></tbody></table>
      </div>
    </div>
  </div>

  <!-- ================= 单台点检 ================= -->
  <div class="sumbar" id="sumbar" hidden>
    <span class="i"><i>设备</i><b id="sm_dev">—</b></span>
    <span class="i"><i>已签名</i><b id="sm_sig" style="color:var(--ok)">0</b><i>天</i></span>
    <span class="i"><i>异常</i><b id="sm_ng" style="color:var(--ng)">0</b><i>项</i></span>
    <span class="sp" style="flex:1"></span>
    <span class="banner warn dirty" id="dirty" style="margin:0;padding:5px 12px">
      <span>● 有未保存的修改</span><span class="sp"></span>
      <button class="btn btn-sm btn-primary" id="dirty_save">立即保存</button>
    </span>
  </div>

  <div id="s_body">
    <div class="panel"><div class="empty"><span class="ico">🔧</span>
      <div class="t">请选择设备</div>
      <div class="d">在上方输入设备编号或名称，从列表中选择后加载本月点检表</div></div></div>
  </div>

</div>

<script>
const { $, $$, esc, api, toast, mountNav, localToday, thisMonth, daysInMonth, debounce } = CORE;

/* ================= 常量与状态 ================= */
const DOW = ['日','一','二','三','四','五','六'];
const ST = { ok:{mark:'√',cls:'ok',next:'ng'}, ng:{mark:'×',cls:'ng',next:'holiday'},
             holiday:{mark:'/',cls:'holiday',next:'none'}, none:{mark:'',cls:'empty',next:'ok'} };

let DEVICES=[], SIGNERS=[], ROOMS=[], CUR_ROOM='', ROOM_SCOPE=null;
let CUR=null, CUR_MONTH=null, SIG_ASSETS={}, CAN_DELETE=false, SIGN_NO_PW=false;
let STATE={ items:[], dailyItems:[], monthlyItems:[], matrix:{}, monthlyStatus:{}, abnormal:[],
            abnormalSaved:[], days:{}, autoSlash:{}, touched:{} };
let DIRTY=false;
const MONTH_CACHE = new Map();   // 月 → /api/monthly 结果（切换设备不再重复请求）

function setDirty(v){
  DIRTY = v;
  $('#dirty').classList.toggle('on', !!v);
}
function markDirty(){ setDirty(true); }

/* ================= 设备组合框 ================= */
const combo = {
  idx: -1, list: [],
  open(){ const b=$('#devlist'); if(!b.hidden) return; b.hidden=false; $('#f_dev').setAttribute('aria-expanded','true'); },
  close(){ const b=$('#devlist'); b.hidden=true; $('#f_dev').setAttribute('aria-expanded','false'); this.idx=-1; },
  pool(){
    return DEVICES.filter(d => CUR_ROOM ? (d.location===CUR_ROOM)
                                        : (!ROOM_SCOPE || ROOM_SCOPE.has(String(d.location||'').trim())));
  },
  render(q){
    const box = $('#devlist');
    const kw = (q||'').trim().toLowerCase();
    let list = this.pool();
    if (kw) list = list.filter(d =>
      String(d.no||'').toLowerCase().includes(kw) ||
      String(d.name||'').toLowerCase().includes(kw) ||
      String(d.model||'').toLowerCase().includes(kw));
    if (list.length > 300) list = list.slice(0,300);
    this.list = list;
    if (!list.length) { box.innerHTML = '<div class="combo-empty">没有匹配的设备</div>'; return; }
    box.innerHTML = list.map((d,i)=>
      `<button type="button" class="combo-opt" role="option" data-i="${i}">
         <span class="n">${esc(d.no)}</span><span>${esc(d.name)}</span>
         <span class="m">${esc(d.model||'')}</span></button>`).join('');
    $$('#devlist .combo-opt').forEach(b=>b.addEventListener('click',()=>{
      pick(this.list[+b.dataset.i]);
    }));
  },
  move(step){
    const opts = $$('#devlist .combo-opt');
    if(!opts.length) return;
    this.idx = (this.idx + step + opts.length) % opts.length;
    opts.forEach((o,i)=>o.classList.toggle('active', i===this.idx));
    opts[this.idx].scrollIntoView({block:'nearest'});
  }
};
function pick(d){
  if(!d) return;
  combo.close();
  $('#f_dev').value = d.no + ' · ' + d.name;
  CUR = d;
  loadMonth();
}

/* ================= 数据加载 ================= */
async function fetchMonth(month, force){
  if (!force && MONTH_CACHE.has(month)) return MONTH_CACHE.get(month);
  const data = await api('/api/monthly?month=' + encodeURIComponent(month));
  if (!data.__error) MONTH_CACHE.set(month, data);
  return data;
}

async function loadMonth(){
  if(!CUR) return;
  const month = $('#f_month').value || thisMonth();
  CUR_MONTH = month;
  if (STATE._mk !== CUR.id + '|' + month) { STATE.touched = {}; STATE._mk = CUR.id + '|' + month; }

  $('#sumbar').hidden = false;
  $('#sm_dev').textContent = CUR.no + ' ' + (CUR.name||'');
  $('#s_body').innerHTML = '<div class="panel"><div class="empty"><div class="t">加载中…</div></div></div>';

  const mon = await fetchMonth(month);
  if (mon.__error) {
    $('#s_body').innerHTML = `<div class="panel"><div class="empty"><span class="ico">⚠️</span>
      <div class="t">加载点检表失败</div><div class="d">${esc(mon.__error)}</div>
      <div class="mt-4"><button class="btn btn-primary" id="retry">重试</button></div></div></div>`;
    $('#retry').onclick = () => { MONTH_CACHE.delete(month); loadMonth(); };
    return;
  }
  SIG_ASSETS = mon.sig_assets || {};
  const dmon = (mon.devices||[]).find(d=>d.id===CUR.id) || { items:[], days:{} };
  renderMonth(CUR, month, dmon);
  setDirty(false);
}

/* ================= 渲染月度表 ================= */
function renderMonth(dev, month, dmon){
  const [yy,mm] = month.split('-');
  const dim = daysInMonth(yy,mm);
  const today = localToday();
  const items = (dmon.items && dmon.items.length) ? dmon.items : [];
  const days = dmon.days || {};
  const formHead = [dmon.form_code||'DEMO-QR-032', dmon.form_rev||'Rev.A1'].join(' ');
  const tblTitle = dmon.title || '设备维护保养记录';
  const tblTitleEn = dmon.title_en || 'Maintenance Record of Equipment';

  const dailyItems = items.filter(it=>it.frequency!=='每月');
  const monthlyItems = items.filter(it=>it.frequency==='每月');
  STATE.items=items; STATE.dailyItems=dailyItems; STATE.monthlyItems=monthlyItems;
  STATE.days=days; STATE.matrix={}; STATE.monthlyStatus={}; STATE.autoSlash={};
  STATE.touched=STATE.touched||{};
  STATE.abnormal=(dmon.abnormal||[]).map(a=>Object.assign({key:a.freq==='每月'?'M#'+a.sn:a.date+'#'+a.sn}, a));
  STATE.abnormalSaved=STATE.abnormal.map(a=>Object.assign({},a));

  const isWeekly = dailyItems.length>0 && dailyItems.every(it=>String(it.frequency||'').indexOf('周')>=0);
  STATE.isWeekly = isWeekly;
  for(let day=1; day<=dim; day++){
    const dd = `${yy}-${mm}-${CORE.p2(day)}`;
    const cell = days[dd]; const row = {};
    dailyItems.forEach(it=>{ row[it.sn] = cell ? (cell.bySn&&cell.bySn[it.sn] ? cell.bySn[it.sn] : 'ok') : 'none'; });
    if(isWeekly && !cell && !STATE.touched[dd] && dd<=today && new Date(+yy,+mm-1,day).getDay()!==1){
      dailyItems.forEach(it=>{ row[it.sn]='holiday'; });
      STATE.autoSlash[dd]=true;
    }
    STATE.matrix[dd]=row;
  }
  monthlyItems.forEach(it=>{
    let status='none';
    for(let day=1; day<=dim; day++){
      const dd=`${yy}-${mm}-${CORE.p2(day)}`; const cell=days[dd];
      if(cell && cell.bySn && cell.bySn[it.sn]){
        const s=cell.bySn[it.sn];
        if(s==='ng'){status='ng';break;}
        if(s==='ok'&&status==='none')status='ok';
      }
    }
    STATE.monthlyStatus[it.sn]=status;
  });

  const totalRowCount = Math.max(1, dailyItems.length + monthlyItems.length);
  const dailyRowPt = Math.max(12, Math.min(28, Math.floor(380/totalRowCount)));
  const monthlyRowPt = Math.max(16, dailyRowPt+4);

  let dayHeads='';
  for(let day=1; day<=dim; day++){
    dayHeads += `<th class="c-day">${day}<span class="dow">${DOW[new Date(+yy,+mm-1,day).getDay()]}</span></th>`;
  }
  let rows='';
  if(!items.length){
    rows = `<tr><td class="sn"></td><td class="c-content" colspan="2">该设备无点检项，请先在后台关联模板</td>${'<td></td>'.repeat(dim)}</tr>`;
  } else {
    dailyItems.forEach(it=>{
      let cells='';
      for(let day=1; day<=dim; day++){
        const dd=`${yy}-${mm}-${CORE.p2(day)}`;
        const st=STATE.matrix[dd][it.sn]||'none'; const meta=ST[st];
        const isFuture = dd > today;
        const auto = STATE.autoSlash[dd] ? ' data-auto="1"' : '';
        const ttl = isFuture ? '未来日期不可点检'
          : (STATE.autoSlash[dd] ? '周检设备非检查日（非周一）已自动划杠；点击可改为实际点检结果'
                                 : '点击切换：√正常 / ×异常 / 节假日 / 空');
        cells += `<td class="mcell ${meta.cls}${isFuture?' future':''}${STATE.autoSlash[dd]?' auto-slash':''}"
          data-day="${dd}" data-sn="${it.sn}" data-st="${st}"${isFuture?' data-future="1"':''}${auto} title="${ttl}">${meta.mark}</td>`;
      }
      rows += `<tr style="height:${dailyRowPt}pt"><td class="sn">${it.sn}</td><td class="c-content">${esc(it.content)}</td>
        <td class="c-freq">${esc(it.frequency)}</td>${cells}</tr>`;
    });
    monthlyItems.forEach(it=>{
      const st=STATE.monthlyStatus[it.sn]||'none'; const meta=ST[st];
      const mFuture = month > today.slice(0,7);
      rows += `<tr style="height:${monthlyRowPt}pt"><td class="sn">${it.sn}</td>
        <td class="c-content c-content-monthly">${esc(it.content)}</td><td class="c-freq">${esc(it.frequency)}</td>
        <td class="mcell mcell-monthly ${meta.cls}" data-sn="${it.sn}" data-monthly="1" data-st="${st}"${mFuture?' data-future="1"':''}
        colspan="${dim}" title="${mFuture?'未来月份不可点检':'每月只需点检一次：点击切换 √正常 / ×异常 / 空'}">${meta.mark}</td></tr>`;
    });
  }

  let sigCells='';
  for(let day=1; day<=dim; day++){
    const dd=`${yy}-${mm}-${CORE.p2(day)}`;
    const cell=days[dd];
    const simg=cell&&cell.signature_image?cell.signature_image:null;
    const asset=(cell&&cell.signer_id&&SIG_ASSETS[cell.signer_id])||{};
    const sh=asset.h||simg, sv=asset.v||simg;
    const struck=dayStruck(dd);
    const body = struck ? '<span class="sigslash">/</span>'
      : (sh?`<img src="${sh}"${SIGFIT.attrs(sh,sv)} class="sigthumb" alt="签名">`:'<span class="sph">＋</span>');
    const cls='sigcell c-day'+(struck?' struck':'');
    const ttl= struck ? `${dd}｜非检查日 / 已划杠，无需签名` : `${dd}｜点击用下方签名人电子签名到此日`;
    sigCells += `<td class="${cls}" data-day="${dd}" tabindex="0" role="button" title="${ttl}">${sigDelHTML(dd)}${body}</td>`;
  }

  const so = SIGNERS.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');

  $('#s_body').innerHTML = `
  <div class="sheet">
    <div class="print-code">${esc(formHead)}</div>
    <div class="dev-block">
      <div class="dev-header">
        <div class="dh-code">${esc(formHead)}</div>
        <div class="dh-title">${esc(tblTitle)}<span class="en">${esc(tblTitleEn)}</span></div>
        <div class="dh-meta">
          <span>年 <b>${yy}</b></span><span>月 <b>${mm}</b></span>
          <span>设备名称 Name of Equipments：<b>${esc(dev.name)}</b></span>
          <span>型号 Model：<b>${esc(dev.model)}</b></span>
          <span>编号 No.：<b>${esc(dev.no)}</b></span>
        </div>
      </div>
      <div class="grid-wrap">
        <table class="mtable">
          <thead><tr><th class="c-sn">序号<br>SN</th><th class="c-content">检查内容 Contents</th>
            <th class="c-freq">频率<br>Freq</th>${dayHeads}</tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr class="sigrow"><td class="sn">签名</td>
            <td class="c-content" colspan="2">维护人员<br>Signer</td>${sigCells}</tr></tfoot>
        </table>
      </div>
    </div>
    ${isWeekly?`<div class="wk-hint">📅 本设备为<b>周检</b>（检查日固定为<b>周一</b>）：非检查日已自动划「/」，签名行同步杠掉，这些日期不写入数据；如需在非检查日补点检，直接点击该格改为 √/× 即可。</div>`:''}
    ${CAN_DELETE?`<div class="del-hint">🗑 删除：签名格右上角的 <span class="sigdel-demo">✕</span> 删掉<b>该日</b>的点检内容与电子签名；下方「🗑 删除本月点检」清空<b>整月</b>。两项都不可恢复。</div>`:''}
    <div class="mlegend">🖱 点击状态格切换：<b>√正常</b> → <b>×异常</b> → <b>/节假日</b> → <b>空</b> → √　|　底部选好<b>签名人+密码</b>后，点签名行任意「＋」即<b>电子签名到该日</b></div>

    <div class="sig-ops">
      <div class="so-title">🔐 本月签名 Signature（${SIGN_NO_PW?'已开启免密：选好签名人，点签名行的「＋」即签':'登记签名人 + 密码，电子签名由后台统一上传'}）</div>
      <div class="so-meta">
        <select id="s_signer">${so}</select>
        <input type="password" id="s_pw" placeholder="签名人密码"${SIGN_NO_PW?' hidden':''}>
        ${SIGN_NO_PW?'<span class="sm muted">免密已开启</span>':''}
      </div>
      <div class="so-prev" data-so="prev"></div>
      <div class="sig-line">维护人员 Maintainer：<span id="s_sigprev"><span class="muted">未签名</span></span></div>
    </div>

    <div class="abn-section" id="abn_zone">
      <div class="abn-h">⚠ 异常情况及处理记录（点检中标记「×」的项将自动列出）</div>
      <div id="abn_list"></div>
    </div>
    <div class="abn-section print-only" id="abn_print">
      <div class="abn-h">异常情况及处理记录</div>
      <div id="abn_print_list"></div>
    </div>
    ${dmon.note?`<div class="note-line"><b>备注 Note：</b>${esc(dmon.note)}</div>`:''}

    <div class="actions">
      <button class="btn btn-primary" id="s_save">💾 保存整月</button>
      <button class="btn btn-ghost" id="s_print">🖨 打印本月</button>
      ${CAN_DELETE?`<button class="btn btn-danger" id="s_delmonth">🗑 删除本月点检</button>`:''}
    </div>
  </div>`;

  bindSheet();
  SIGFIT.fit($('#s_body'));
  syncAbnormalList();
  updateSigPreview();
  updateSummary();
}

function dayStruck(dd){
  const row=STATE.matrix[dd]; if(!row) return false;
  const items=STATE.dailyItems||[]; if(!items.length) return false;
  return items.every(it=>(row[it.sn]||'none')==='holiday');
}
function sigDelHTML(dd){
  if(!CAN_DELETE || !(STATE.days&&STATE.days[dd])) return '';
  return `<span class="sigdel" data-delday="${dd}" role="button" tabindex="0"
    title="删除 ${dd} 的点检内容与电子签名（不可恢复）">✕</span>`;
}

function bindSheet(){
  $$('#s_body .mcell').forEach(c=>c.addEventListener('click',()=>onCellClick(c)));
  $$('#s_body .sigcell').forEach(td=>{
    if(td.classList.contains('struck')) return;
    const dd = td.dataset.day;
    td.addEventListener('click', ()=>onSigCellClick(dd));
    td.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); onSigCellClick(dd); } });
  });
  $$('#s_body .sigdel').forEach(el=>{
    if (el.dataset.bound) return; el.dataset.bound = '1';
    const dd = el.dataset.delday;
    el.addEventListener('click', e=>{ e.stopPropagation(); deleteDay(dd); });
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); e.stopPropagation(); deleteDay(dd); } });
  });
  // 异常明细输入（事件委托）
  $('#s_body').addEventListener('input', e=>{
    const el = e.target.closest && e.target.closest('.abn-input'); if(!el) return;
    const item = STATE.abnormal.find(a=>a.key===el.dataset.key); if(!item) return;
    item[el.dataset.f] = el.value;
    markDirty();
  });
  const ss=$('#s_signer'); if(ss) ss.addEventListener('change', updateSigPreview);
  $('#s_save').onclick = saveMonth;
  $('#s_print').onclick = ()=>window.print();
  const dm=$('#s_delmonth'); if(dm) dm.onclick = deleteMonth;
}

function updateSummary(){
  const sigN = Object.keys(STATE.days||{}).length;
  let ngN = 0;
  for(const dd in STATE.matrix){ const r=STATE.matrix[dd]; for(const sn in r) if(r[sn]==='ng') ngN++; }
  for(const sn in STATE.monthlyStatus) if(STATE.monthlyStatus[sn]==='ng') ngN++;
  const e1=$('#sm_sig'), e2=$('#sm_ng');
  if(e1) e1.textContent = sigN;
  if(e2) e2.textContent = ngN;
}

/* ================= 交互 ================= */
function onCellClick(c){
  if(c.dataset.future){ toast('未来日期不可点检','err'); return; }
  const cur=c.dataset.st||'none'; const nxt=ST[cur].next;
  c.dataset.st=nxt;
  c.className='mcell'+(c.dataset.monthly?' mcell-monthly':'')+' '+ST[nxt].cls;
  c.textContent=ST[nxt].mark;
  if(c.dataset.monthly){
    STATE.monthlyStatus[+c.dataset.sn]=nxt;
  } else {
    const dd=c.dataset.day, sn=+c.dataset.sn;
    if(!STATE.matrix[dd]) STATE.matrix[dd]={};
    STATE.matrix[dd][sn]=nxt;
    STATE.touched[dd]=true;
    delete STATE.autoSlash[dd];
    c.dataset.auto=''; c.classList.remove('auto-slash');
    refreshSigCell(dd);
  }
  syncAbnormalList(); updateSummary(); markDirty();
}

function refreshSigCell(dd){
  const td=document.querySelector('.sigcell[data-day="'+dd+'"]'); if(!td) return;
  const cell=STATE.days?STATE.days[dd]:null;
  const simg=cell&&cell.signature_image?cell.signature_image:null;
  const asset=(cell&&cell.signer_id&&SIG_ASSETS[cell.signer_id])||{};
  const sh=asset.h||simg, sv=asset.v||simg;
  const struck=dayStruck(dd);
  td.className='sigcell c-day'+(struck?' struck':'');
  td.title=struck ? (dd+'｜非检查日 / 已划杠，无需签名') : (dd+'｜点击用下方签名人电子签名到此日');
  td.innerHTML=sigDelHTML(dd)+(struck?'<span class="sigslash">/</span>'
    :(sh?`<img src="${sh}"${SIGFIT.attrs(sh,sv)} class="sigthumb" alt="签名">`:'<span class="sph">＋</span>'));
  // 重新绑定（innerHTML 重写后旧监听失效）
  $$('#s_body .sigdel').forEach(el=>{
    if(el.dataset.bound) return; el.dataset.bound='1';
    const dd = el.dataset.delday;
    el.addEventListener('click', e=>{ e.stopPropagation(); deleteDay(dd); });
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); e.stopPropagation(); deleteDay(dd); } });
  });
  if(!struck) td.onclick=()=>onSigCellClick(dd);
  SIGFIT.fit(td);
}

async function onSigCellClick(day){
  if(!CUR){ toast('请先选择设备','err'); return; }
  if(day>localToday()){ toast('未来日期不能电子签名','err'); return; }
  const sid=$('#s_signer').value, pw=$('#s_pw')?$('#s_pw').value:'';
  if(!sid||(!SIGN_NO_PW&&!pw)){ toast(SIGN_NO_PW?'请先在下方选择签名人':'请先在下方选择签名人并输入密码','err'); return; }
  const r=await api('/api/inspect/day-sig',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({device_id:CUR.id,date:day,signer_id:sid,password:pw})});
  if(r.__error||r.error){ toast(r.__error||r.error,'err'); return; }
  toast('已电子签名：'+day,'ok');
  const s=SIGNERS.find(x=>String(x.id)===String(sid));
  STATE.touched[day]=true; delete STATE.autoSlash[day];
  if(!STATE.days) STATE.days={};
  const prev=STATE.days[day]||{};
  STATE.days[day]=Object.assign({},prev,{
    signature_image:(s&&(s.signature_image||s.signature_image_v))||prev.signature_image||null,
    signer_id:sid, bySn:Object.assign({},prev.bySn||{})
  });
  if(STATE.matrix[day]){
    STATE.dailyItems.forEach(it=>{ if((STATE.matrix[day][it.sn]||'none')==='none') STATE.matrix[day][it.sn]='ok'; });
    $$('#s_body .mcell[data-day="'+day+'"]').forEach(c=>{
      if(c.dataset.monthly) return;
      if((c.dataset.st||'none')==='none'){ c.dataset.st='ok'; c.className='mcell ok'; c.textContent='√'; }
    });
  }
  refreshSigCell(day); syncAbnormalList(); updateSummary(); updateSigPreview();
  MONTH_CACHE.delete(CUR_MONTH);   // 服务端已变更，清掉缓存
}

async function deleteDay(day){
  if(!CAN_DELETE){ toast('权限不足：删除点检记录需要「批量点检操作」权限','err'); return; }
  if(!CUR) return;
  if(!confirm(`确认删除「${CUR.no} ${CUR.name}」${day} 的点检内容与电子签名？\n此操作不可恢复。`)) return;
  const r=await api('/api/inspect/delete',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({device_id:CUR.id,dates:[day]})});
  if(r.__error||r.error){ toast(r.__error||r.error,'err'); return; }
  if(!r.deleted){ toast(`${day} 本来就没有点检记录`,'err'); return; }
  toast(`已删除 ${day} 的点检记录与签名`,'ok');
  MONTH_CACHE.delete(CUR_MONTH);
  await loadMonth();
}

async function deleteMonth(){
  if(!CAN_DELETE){ toast('权限不足：删除点检记录需要「批量点检操作」权限','err'); return; }
  if(!CUR||!CUR_MONTH) return;
  const n=Object.keys(STATE.days||{}).length;
  if(!n){ toast(`${CUR_MONTH} 没有可删除的点检记录`,'err'); return; }
  if(!confirm(`⚠️ 将永久删除「${CUR.no} ${CUR.name}」${CUR_MONTH} 整月全部点检记录（${n} 天）\n包含点检结果与电子签名，不可恢复！\n\n确定继续？`)) return;
  const r=await api('/api/inspect/delete',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({device_id:CUR.id,month:CUR_MONTH})});
  if(r.__error||r.error){ toast(r.__error||r.error,'err'); return; }
  toast(`已删除 ${CUR_MONTH} 整月点检：${r.deleted} 条${r.abn_deleted?`（含异常明细 ${r.abn_deleted} 条）`:''}`,'ok');
  STATE.touched={};
  MONTH_CACHE.delete(CUR_MONTH);
  await loadMonth();
}

/* ================= 异常明细 ================= */
function syncAbnormalList(){
  if(!CUR_MONTH) return;
  const ng=new Map();
  for(const dd in STATE.matrix){
    const row=STATE.matrix[dd];
    for(const sn in row){
      if(row[sn]==='ng'){
        const it=STATE.dailyItems.find(x=>String(x.sn)===String(sn));
        ng.set(dd+'#'+sn,{key:dd+'#'+sn,date:dd,sn:+sn,freq:it?it.frequency:'每日',content:it?it.content:''});
      }
    }
  }
  for(const sn in STATE.monthlyStatus){
    if(STATE.monthlyStatus[sn]==='ng'){
      const it=STATE.monthlyItems.find(x=>String(x.sn)===String(sn));
      ng.set('M#'+sn,{key:'M#'+sn,date:'',sn:+sn,freq:'每月',content:it?it.content:''});
    }
  }
  const kept=[];
  ng.forEach((meta,key)=>{
    const exist=STATE.abnormal.find(a=>a.key===key);
    if(exist){ Object.assign(exist,meta); kept.push(exist); }
    else kept.push(Object.assign({id:key,abnormal:'',handle:'',handler:'',handle_date:''},meta));
  });
  STATE.abnormal=kept;
  renderAbnormal();
}
function renderAbnormal(){
  const list=STATE.abnormal||[];
  const saved=(STATE.abnormalSaved&&STATE.abnormalSaved.length)?STATE.abnormalSaved:list;
  const head='<table class="abn-table"><thead><tr><th class="c-date">日期</th><th class="c-sn">序号</th><th>检查内容</th><th class="c-abn">异常情况</th><th class="c-handle">处理记录(措施)</th><th class="c-person">处理人</th><th class="c-hdate">处理日期</th></tr></thead><tbody>';
  const e1=$('#abn_list'), e2=$('#abn_print_list'); if(!e1||!e2) return;
  e1.innerHTML = list.length ? head + list.map(ab=>`<tr data-key="${esc(ab.key)}">
      <td>${ab.freq==='每月'?'本月':esc(ab.date)}</td><td>${ab.sn}</td><td class="ac">${esc(ab.content)}</td>
      <td><textarea class="abn-input" data-f="abnormal" data-key="${esc(ab.key)}" placeholder="异常情况描述">${esc(ab.abnormal||'')}</textarea></td>
      <td><textarea class="abn-input" data-f="handle" data-key="${esc(ab.key)}" placeholder="处理记录/措施">${esc(ab.handle||'')}</textarea></td>
      <td><input class="abn-input" data-f="handler" data-key="${esc(ab.key)}" value="${esc(ab.handler||'')}" placeholder="处理人"></td>
      <td><input type="date" class="abn-input" data-f="handle_date" data-key="${esc(ab.key)}" value="${esc(ab.handle_date||'')}"></td>
    </tr>`).join('') + '</tbody></table>'
    : '<div class="abn-empty">本月暂无异常；在点检格点击切换为「×」后，此处自动列出需填写的异常项。</div>';
  e2.innerHTML = saved.length ? head + saved.map(ab=>`<tr>
      <td>${ab.freq==='每月'?'本月':esc(ab.date)}</td><td>${ab.sn}</td><td class="ac">${esc(ab.content)}</td>
      <td>${esc(ab.abnormal||'—')}</td><td>${esc(ab.handle||'—')}</td>
      <td>${esc(ab.handler||'—')}</td><td>${esc(ab.handle_date||'—')}</td>
    </tr>`).join('') + '</tbody></table>'
    : '<div class="abn-empty">本月无异常情况记录。</div>';
}

/* ================= 签名 ================= */
async function updateSigPreview(){
  const el=$('#s_sigprev'); if(!el) return;
  const sid=$('#s_signer')?$('#s_signer').value:'';
  const s=SIGNERS.find(x=>String(x.id)===String(sid));
  if(!s){ el.innerHTML='<span class="muted">未选择</span>'; return; }
  el.innerHTML=`<b>${esc(s.name)}</b> <span class="muted">（登记签名人）</span>`;
  const r=await api('/api/signers/'+sid+'/sig');
  if(r && r.image) el.innerHTML=`<img src="${r.image}" style="height:38px;vertical-align:middle;border:1px solid #ddd;border-radius:4px;background:#fff;padding:2px 4px"> <b>${esc(s.name)}</b>`;
}

async function saveMonth(){
  if(!CUR) return;
  syncAbnormalList();
  const sid=$('#s_signer').value, pw=$('#s_pw')?$('#s_pw').value:'';
  if(!sid||(!SIGN_NO_PW&&!pw)){ toast(SIGN_NO_PW?'请选择登记签名人':'请选择登记签名人并输入密码','err'); return; }
  const days={}; const today=localToday();
  for(const dd in STATE.matrix){
    if(dd>today) continue;
    if(STATE.autoSlash[dd] && !STATE.touched[dd]) continue;
    const row=STATE.matrix[dd]; let any=false; const bySn={};
    STATE.dailyItems.forEach(it=>{ const st=row[it.sn]||'none'; if(st!=='none'){bySn[it.sn]=st;any=true;} });
    STATE.monthlyItems.forEach(it=>{ const st=STATE.monthlyStatus[it.sn]||'none'; if(st!=='none'){bySn[it.sn]=st;any=true;} });
    if(any) days[dd]={bySn};
  }
  const btn=$('#s_save'); btn.disabled=true; btn.textContent='保存中…';
  const r=await api('/api/inspect/month',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({device_id:CUR.id,month:CUR_MONTH,days,abnormal:STATE.abnormal,signer_id:sid,password:pw})});
  btn.disabled=false; btn.textContent='💾 保存整月';
  if(r.__error||r.error){ toast(r.__error||r.error,'err'); return; }
  toast(`已保存整月：${r.created} 新建 / ${r.updated} 更新`,'ok');
  MONTH_CACHE.delete(CUR_MONTH);
  await loadMonth();
}

/* ================= 一键点检 ================= */
function renderBatch(){
  $('#b_list').innerHTML = DEVICES.map(d=>`<tr>
    <td>${esc(d.no)}</td><td>${esc(d.name)}</td><td>${esc(d.model||'')}</td>
    <td style="text-align:center"><input type="checkbox" class="abn" data-id="${esc(d.id)}" aria-label="标记 ${esc(d.no)} 异常"></td>
    <td><input type="text" class="abn_note" data-id="${esc(d.id)}" placeholder="异常说明"></td></tr>`).join('');
}
$('#b_go').onclick = async ()=>{
  const sid=$('#b_signer').value, pw=$('#b_pw')?$('#b_pw').value:'', date=$('#b_date').value;
  if(!sid||(!SIGN_NO_PW&&!pw)){ toast(SIGN_NO_PW?'请选择签名人':'请选择签名人并输入密码','err'); return; }
  if(!date){ toast('请选择点检日期','err'); return; }
  if(date>localToday()){ toast('不能点检未来日期','err'); return; }
  const devices=[];
  $$('#b_list .abn').forEach(c=>{
    if(!c.checked) return;
    const n=$('#b_list .abn_note[data-id="'+c.dataset.id+'"]');
    devices.push({device_id:c.dataset.id, abnormal:true, note: n?n.value:''});
  });
  $('#b_go').disabled=true;
  const r=await api('/api/inspect/batch',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({date,signer_id:sid,password:pw,devices})});
  $('#b_go').disabled=false;
  if(r.__error||r.error){ toast(r.__error||r.error,'err'); return; }
  $('#b_stat').textContent=`已点检 ${r.signed} 台（异常 ${devices.length} 台）· 签名人：${r.signer}`;
  toast(`一键点检完成：${r.signed} 台`,'ok');
  MONTH_CACHE.clear();
};

/* ================= 初始化 ================= */
function syncRoomLinks(){
  const q=encodeURIComponent(CUR_ROOM||'');
  $('#go_env').href='/env?room='+q;
  $('#go_all').href='/print-all?room='+q+'&month='+encodeURIComponent($('#f_month').value||thisMonth())+'&auto=1';
}
function roomOpts(list, cur, allLabel){
  const opt=r=>`<option value="${esc(r.name)}"${r.name===cur?' selected':''}>${esc(r.name)}</option>`;
  const groups=[], plain=[];
  (list||[]).forEach(r=>{
    const g=String(r.group||'').trim();
    if(g){ let e=groups.find(x=>x.g===g); if(!e){e={g:g,items:[]};groups.push(e);} e.items.push(r); }
    else plain.push(r);
  });
  return (allLabel!=null?`<option value=""${cur===''?' selected':''}>${esc(allLabel)}</option>`:'')
    + groups.map(e=>`<optgroup label="${esc(e.g)}">${e.items.map(opt).join('')}</optgroup>`).join('')
    + plain.map(opt).join('');
}

async function init(){
  // 登录信息 / 导航
  let me={ok:false};
  try{ me=await CORE.me(); }catch(e){}
  mountNav({ me });
  // 权限判定必须与 server.js PERM_DEFS 一致：inspect_batch 默认 0（关闭）。
  // 注意 me.perms 为 null（从未配置过的老账号）或对象里缺该 key 时，都按默认 0 处理。
  CAN_DELETE = !!(me && me.ok && (me.role==='admin'
    || (me.perms && Object.prototype.hasOwnProperty.call(me.perms,'inspect_batch') && !!me.perms.inspect_batch)));
  if(me && me.ok && me.role==='admin') $('#p_batch').hidden=false;

  $('#b_date').value = localToday();
  $('#b_date').max   = localToday();
  $('#f_month').value = thisMonth();

  DEVICES = await api('/api/devices'); if(!Array.isArray(DEVICES)) DEVICES=[];
  SIGNERS = await api('/api/signers/public'); if(!Array.isArray(SIGNERS)) SIGNERS=[];
  const st = await api('/api/settings'); SIGN_NO_PW = !!(st && st.signNoPw);
  $('#b_pw_box').hidden = SIGN_NO_PW;
  $('#b_signer').innerHTML = SIGNERS.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
  renderBatch();

  // 房间
  if(window.DEPT){ try{ await DEPT.load(); }catch(e){} }
  let all=[]; try{ all=await api('/api/rooms'); }catch(e){ all=[]; }
  ROOMS = (window.DEPT?DEPT.filterRooms(all):all) || [];
  ROOM_SCOPE = (window.DEPT && !DEPT.canSeeAll()) ? new Set(ROOMS.map(r=>r.name)) : null;
  const qs=new URLSearchParams(location.search);
  const rp=qs.get('room');
  if(rp && ROOMS.some(r=>r.name===rp)) CUR_ROOM=rp;
  else if(ROOMS.some(r=>r.name===CORE.session.room)) CUR_ROOM=CORE.session.room;
  $('#f_room').innerHTML = roomOpts(ROOMS, CUR_ROOM, '全部房间');
  $('#f_room').onchange = ()=>{
    CUR_ROOM = $('#f_room').value;
    CORE.session.room = CUR_ROOM;
    syncRoomLinks();
    $('#f_dev').value=''; CUR=null;
    $('#sumbar').hidden=true;
    $('#s_body').innerHTML='<div class="panel"><div class="empty"><div class="t">请选择设备</div></div></div>';
  };
  syncRoomLinks();

  // 组合框交互
  const inp=$('#f_dev');
  inp.addEventListener('focus', ()=>{ combo.render(''); combo.open(); });
  inp.addEventListener('input', debounce(()=>{ combo.render(inp.value); combo.open(); }, 160));
  inp.addEventListener('keydown', e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); combo.open(); combo.move(1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); combo.move(-1); }
    else if(e.key==='Enter'){
      e.preventDefault();
      if(combo.idx>=0 && combo.list[combo.idx]) pick(combo.list[combo.idx]);
      else { const first=combo.pool(); if(first.length===1) pick(first[0]); }
    }
    else if(e.key==='Escape'){ combo.close(); inp.blur(); }
  });
  document.addEventListener('click', e=>{
    const t = e.target;
    if (t && t.closest && t.closest('.combo')) return;
    combo.close();
  });

  $('#f_month').addEventListener('change', ()=>{ if(CUR) loadMonth(); });
  $('#dirty_save').onclick = saveMonth;

  // 未保存离开拦截
  window.addEventListener('beforeunload', e=>{
    if(!DIRTY) return;
    e.preventDefault(); e.returnValue='';
  });

  // 支持从大屏直接定位（?device=编号 / ?dev=ID）
  const devParam=qs.get('device')||qs.get('dev'), monthParam=qs.get('month');
  if(monthParam) $('#f_month').value=monthParam;
  if(devParam){
    const pool=DEVICES.filter(d=>CUR_ROOM?(d.location===CUR_ROOM):(!ROOM_SCOPE||ROOM_SCOPE.has(String(d.location||'').trim())));
    // 精确编号/ID 视为深链接（大屏卡片就是按编号跳的），不受当前房间筛选影响，
    // 否则会话房间停在冲击室时，点显微镜的编号链接会变成「未找到设备」；
    // 模糊匹配（整名/片段）仍只在当前房间内找，避免越房间乱跳。
    const d = DEVICES.find(x=>String(x.no)===devParam) || DEVICES.find(x=>String(x.id)===devParam)
           || pool.find(x=>(x.name||'')===devParam) || pool.find(x=>x.name&&x.name.includes(devParam));
    if(d){
      try{
        // v1.24.0：一台设备可以「既有自己的点检模板、又参与独立检查项目」（冲击机 = 设备点检 + 摩擦风阻）。
        // 只有**没有**自身点检模板（如旧显微镜模板已清理）的设备才把旧点检页让给检查表页；
        // 否则设备卡会被劫持到专项表，它自己的点检表就再也进不去了。
        const [prgs,tpls]=await Promise.all([api('/api/programs'),api('/api/templates')]);
        const mine=(Array.isArray(tpls)?tpls:[]).some(t=>t&&t.id===d.template_id);
        const hit=mine?null:(Array.isArray(prgs)?prgs:[]).find(p=>(p.devices||[]).some(x=>String(x.no)===String(d.no)));
        if(hit){
          // 该设备没有自身点检表、只归属「独立检查项目」→ 旧点检页停用，直达检查表页
          location.replace('/check.html?program='+encodeURIComponent(hit.id)+'&device='+encodeURIComponent(d.no)+(monthParam?'&ym='+encodeURIComponent(monthParam):''));
          return;
        }
      }catch(e){}
      pick(d);
    }
    else toast('未找到设备：'+devParam,'err');
  }
}
init();
</script>

<script>
/* 演示站只读模式：仅浏览，禁用一切写入操作的入口与提示 */
(function () {
  if (window.__READONLY_INJECTED__) return; window.__READONLY_INJECTED__ = true;

    bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#2563eb;color:#fff;'
      + 'font-size:13px;line-height:1.7;padding:6px 12px;text-align:center;'
      + 'box-shadow:0 1px 4px rgba(0,0,0,.3);box-sizing:border-box';
    if (!document.getElementById('ro-banner-style')) {
      var st = document.createElement('style');
      st.id = 'ro-banner-style';
      st.textContent = '@media print{#ro-banner{display:none!important}body{padding-top:0!important}}';
      (document.head || document.documentElement).appendChild(st);
    }
    var host = document.body || document.documentElement;
    host.appendChild(bar);
    function reserveTop() {
      var b = document.body; if (!b) return;
      b.style.boxSizing = 'border-box';
      b.style.paddingTop = ((bar.offsetHeight || 30) + 2) + 'px';
    }
    reserveTop();
    window.addEventListener('resize', reserveTop);
    setTimeout(reserveTop, 300);
    setTimeout(reserveTop, 1200);
  }
  function hideWrites() {
    var verbs = ['新增','添加','删除','编辑','保存','提交','导出','备份','恢复','签名','一键','批量','导入','升级','修改','新建','确认点检','整月生成','取消点检','自升级','远程'];
    document.querySelectorAll('button,a,.btn').forEach(function (el) {
      if (el.classList.contains('nav-link') || el.classList.contains('brand')) return;
      var t = (el.textContent || '').replace(/\s+/g, '');
      if (verbs.some(function (v) { return t.indexOf(v) >= 0; })) el.style.display = 'none';
    });
  }
  if (document.readyState !== 'loading') { banner(); hideWrites(); }
  document.addEventListener('DOMContentLoaded', function () { banner(); hideWrites(); });
  setTimeout(hideWrites, 400); setTimeout(hideWrites, 1200); setTimeout(hideWrites, 2500);
  var _fetch = window.fetch ? window.fetch.bind(window) : null;
  if (_fetch) {
    window.fetch = function (u, o) {
      return _fetch(u, o).then(function (r) {
        if (r && r.status === 403) {
          try { r.clone().json().then(function (j) { if (j && j.readonly) alert('演示站为只读展示模式，禁止写入操作；如需浏览后台请使用 admin / admin123 登录'); }); } catch (e) {}
        }
        return r;
      });
    };
  }
})();
</script>
