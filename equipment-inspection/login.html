<script>
const $=s=>document.querySelector(s);
function safeNext(n){ if(!n || n[0]!=='/' || n.indexOf('//')===0) return '/rooms.html'; return n; }
// 登录后默认进入「实验房间选择页」；next 参数优先（页面级跳转回登录时携带原地址）
const target = safeNext(new URLSearchParams(location.search).get('next') || '/rooms.html');
async function doLogin(){
  const u=$('#u').value.trim(), p=$('#p').value;
  if(!u||!p){ $('#err').textContent='请输入账号和密码'; return; }
  const btn=$('#go'); btn.disabled=true; btn.textContent='登录中…';
  try{
    const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})}).then(r=>r.json());
    if(r.ok){
      // 清除上一次会话记住的房间，强制重新选择
      try{ sessionStorage.removeItem('selected_room'); }catch(e){}
      location.href=target; return;
    }
    $('#err').textContent = r.error || '登录失败，请检查账号密码';
  }catch(e){ $('#err').textContent='网络错误，请重试'; }
  btn.disabled=false; btn.textContent='登 录';
}
$('#go').onclick=doLogin;
$('#u').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#p').focus(); });
$('#p').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
$('#u').focus();

// 版本号显示（单一信息源在 server.js 的 APP_VERSION，经 /api/version 下发）
fetch('/api/version').then(r=>r.json()).then(v=>{document.querySelectorAll('[data-appver]').forEach(e=>e.textContent=v.version);}).catch(()=>{});
</script>

<script>
/* 演示站只读模式：仅浏览，禁用一切写入操作的入口与提示 */
(function () {
  if (window.__READONLY_INJECTED__) return; window.__READONLY_INJECTED__ = true;
  function banner() {
    if (document.getElementById('ro-banner')) return;
    var bar = document.createElement('div');
    bar.id = 'ro-banner';
    bar.textContent = '演示站 · 只读展示模式：仅可浏览查看，所有新增 / 编辑 / 删除 / 写入操作均已被禁用';
    // 正常文档流 + 吸顶：占位高度把下方内容顶下去，不会遮挡顶部按钮；滚动时仍贴在顶部
    bar.style.cssText = 'position:sticky;top:0;z-index:2147483647;background:#2563eb;color:#fff;'
      + 'font-size:13px;line-height:1.7;padding:6px 12px;text-align:center;'
      + 'box-shadow:0 1px 4px rgba(0,0,0,.3);box-sizing:border-box';
    if (!document.getElementById('ro-banner-style')) {
      var st = document.createElement('style');
      st.id = 'ro-banner-style';
      st.textContent = '@media print{#ro-banner{display:none!important}}';
      (document.head || document.documentElement).appendChild(st);
    }
    var host = document.body || document.documentElement;
    host.insertBefore(bar, host.firstChild);
  }
  function hideWrites() {
    var verbs = ['新增','添加','删除','编辑','保存','提交','导出','备份','恢复','签名','一键','批量','导入','升级','修改','新建','确认点检','整月生成','取消点检','自升级','远程'];
    document.querySelectorAll('button,a,.btn').forEach(function (el) {
      if (el.classList.contains('nav-link') || el.classList.contains('brand')) return;
      var t = (el.textContent || '').replace(/\s+/g, '');
      if (verbs.some(function (v) { return t.indexOf(v) >= 0; })) el.style.display = 'none';
    });
  }
  if (document.readyState !== 'loading') { banner(); hideWrites(); }
  document.addEventListener('DOMContentLoaded', function () { banner(); hideWrites(); });
  setTimeout(hideWrites, 400); setTimeout(hideWrites, 1200); setTimeout(hideWrites, 2500);
  var _fetch = window.fetch ? window.fetch.bind(window) : null;
  if (_fetch) {
    window.fetch = function (u, o) {
      return _fetch(u, o).then(function (r) {
        if (r && r.status === 403) {
          try { r.clone().json().then(function (j) { if (j && j.readonly) alert('演示站为只读展示模式，禁止写入操作'); }); } catch (e) {}
        }
        return r;
      });
    };
  }
})();
</script>
