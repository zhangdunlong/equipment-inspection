<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>温湿度监测记录</title>
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/sig.js"></script>
<style>
*{box-sizing:border-box}
body{ color:#eaf1fb; }
.wrap{ max-width:1400px; }

/* ===== 工具栏 ===== */
.toolbar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:14px 0 12px; }
.toolbar label{ font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; white-space:nowrap; }
.toolbar select,.toolbar input[type=month]{ padding:7px 10px; border-radius:10px; border:1px solid var(--glass-bd); background:rgba(0,0,0,.25); color:#eaf1fb; font-size:14px; min-width:120px; }
.toolbar select:focus,.toolbar input:focus{ outline:none; border-color:var(--cyan); }
.btn.on{ background:linear-gradient(135deg,#0a8f3c,#12b76a) !important; color:#fff !important; border-color:transparent !important; }
.batch-tip{ font-size:12px; color:#8fe3b0; }

/* ===== 表单：屏幕与打印同一份 DOM ===== */
.sheet-wrap{ border:2px solid #000; border-radius:4px; background:#fff; overflow-x:auto; }
.sheet{ border-collapse:collapse; table-layout:fixed; width:100%; min-width:1180px; background:#fff; color:#000;
        font-family:"Microsoft YaHei","PingFang SC",sans-serif; font-size:12px; }
.sheet td{ border:1px solid #000; padding:0; text-align:center; vertical-align:middle; }
col.c-day{ width:38px; } col.c-t{ width:52px; } col.c-h{ width:52px; } col.c-r{ width:86px; }

/* 标题行 */
.r-title td{ height:54px; font-size:17px; font-weight:800; letter-spacing:3px; padding:6px 8px; }
.r-title .en{ display:block; font-size:10px; font-weight:400; letter-spacing:.4px; margin-top:4px; color:#333; }
/* 表头两行 */
.r-info td{ height:46px; font-size:11px; line-height:1.3; padding:3px 6px; }
.r-info2 td{ height:78px; font-size:11px; line-height:1.3; padding:3px 6px; }
.r-lbl{ font-weight:700; }
.r-lbl .en{ display:block; font-size:9.5px; font-weight:400; color:#333; margin-top:2px; }
.r-val{ font-weight:700; font-size:12px; }
.r-req{ text-align:center; white-space:pre-line; line-height:1.4; font-weight:700; font-size:11px; }
.sheet td.eq-box{ text-align:center; padding:5px 8px; }
.eq-line{ display:grid; gap:8px; line-height:1.55; font-weight:700; font-size:11px; }
.eq-line span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* 时段表头 */
.r-period td{ height:26px; font-size:11.5px; font-weight:700; background:#ececec; }
.r-period .en{ display:block; font-size:9px; font-weight:400; color:#333; margin-top:1px; }
.r-sub td{ height:36px; font-size:10.5px; line-height:1.15; background:#f6f6f6; }
.r-sub .en{ display:block; font-size:9px; font-weight:400; color:#333; line-height:1.15; }
/* 数据行 */
.r-day td{ height:42px; }
.c-day{ background:#f6f6f6; font-weight:700; font-size:13px; }
.vin{ display:block; width:100%; height:100%; border:0; background:transparent; text-align:center; font-family:inherit;
      font-size:12.5px; color:#000; outline:none; padding:0 2px; }
.vin:focus{ background:#fffbe0; }
.vin.bad{ background:#ffe9e9; color:#c00; font-weight:700; }
.vin:disabled{ background:#f2f2f2; }
.rec-in{ display:flex; width:100%; height:100%; align-items:center; justify-content:center; cursor:pointer; }
.rec-in:hover{ background:#eaf6ff; }
.rec-in .plus{ color:#c9c9c9; font-size:15px; line-height:1; }
.rec-img{ display:inline-block; width:78px; height:36px; object-fit:contain; }
td.disabled{ background:#f2f2f2; }
td.disabled .rec-in{ cursor:default; }
.note{ text-align:left !important; padding:5px 8px !important; font-size:11px; line-height:1.4; vertical-align:middle; }

/* ===== 原表单页眉（Excel 页眉右对齐的「DEMO-QR-008 Rev.A0」）：右上角 =====
   用流式元素而非 position:fixed —— fixed 会让 Chrome printToPDF 多出一张空白尾页 */
.sheet-head{ background:#fff; color:#000; text-align:right; padding:8px 10px 2px;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif; font-size:11.5px; font-weight:600; letter-spacing:.4px; }

/* ===== 划线（某日无需记录）：温度 / 湿度 / 记录员共 9 格各画一条横杠，日号格不划（日期要可读） =====
   画法：每格套一层 .stk-clip，由它的 ::before 在格心画一条短横线（长度 1em ≈ 一个「—」字符，
   刻意不贯穿整格 —— 贯穿线更像「表格被划坏」，短横线才是纸质表里「本日无需记录」的手写惯例）。
   为什么不用斜线、不用 SVG：
     1) 斜线要按格子宽高比拉伸，而 td 的高度就是「表格行高」，屏幕态 42px / 打印态 30px 差别很大，
        打印预览重排时按屏幕态行高解析百分比高度 → 斜线被拉长、划破相邻行（2026-09-14 踩过）；
     2) 横线的几何只跟格子中线有关，与宽高比无关，天生不受这个问题影响；
     3) 用 border 而不是背景/渐变 —— border 属前景绘制，打印对话框里「背景图形」没勾选也照样在。 */
.sheet td{ position:relative; }
/* 尺寸由 inset:0 唯一确定（绝对定位四个方向都是 0），不依赖 td 的百分比高度；
   内部 ::before 的 top:50% 参照的是这个「尺寸确定」的框，所以横线永远落在格子中线。
   overflow:hidden 兜底：任何意外都只在本格内显示。 */
.stk-clip{ position:absolute; left:0; top:0; right:0; bottom:0; overflow:hidden; pointer-events:none; }
.stk-clip::before{ content:''; position:absolute; left:50%; top:50%; width:1em; margin-left:-.5em;
  border-top:1.2px solid #000; }             /* 短横线：线长 = 1em（一个「—」的宽度），水平垂直都居中 */
.sheet td.struck{ background:#f7f7f7; }
.sheet td.struck .vin:disabled{ background:#f7f7f7; }
td.c-day[data-day]{ cursor:pointer; }
body.strike-mode .sheet td[data-day]{ cursor:crosshair; }
body.strike-mode tr.r-day:hover td.c-day{ background:#ffe9a8; }

/* ===== 签名面板 ===== */
#sigMask .modal{ max-width:420px; }
.sig-form{ display:flex; flex-direction:column; gap:12px; }
.sig-form select,.sig-form input{ width:100%; padding:10px 12px; border-radius:11px; border:1px solid var(--glass-bd); background:rgba(0,0,0,.25); color:#eaf1fb; font-size:14px; }
.sig-form select option{ background:#16233f; }
.sig-preview-box{ min-height:70px; background:rgba(255,255,255,.92); border-radius:10px; display:flex; align-items:center; justify-content:center; padding:8px; }
.sig-preview-box img{ max-height:52px; max-width:100%; object-fit:contain; }
.sig-preview-box .empty{ color:#666; font-size:13px; }
.sig-hint{ font-size:12px; color:var(--muted); line-height:1.5; }
.sig-actions{ display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:4px; }
.sig-actions.left{ justify-content:flex-start; margin-top:2px; }

/* ===== 打印：A4 横向，整表单页 ===== */
/* 表头缺项提示：只在屏幕上提醒管理员去后台补填，不参与打印 */
.cfg-hint{ display:none; margin:0 0 12px; padding:11px 15px; border-radius:12px; font-size:13px; line-height:1.7;
  background:rgba(255,209,102,.12); border:1px solid rgba(255,209,102,.5); color:#ffd166; }
.cfg-hint.show{ display:block; }
.cfg-hint a{ color:#ffd166; font-weight:700; text-decoration:underline; }
.cfg-hint .sub{ font-size:11.5px; color:rgba(255,209,102,.8); margin-top:4px; font-weight:400; }

@media print{
  @page{ size:A4 landscape; margin:7mm 8mm; }
  *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
  html,body{ background:#fff !important; color:#000 !important; margin:0 !important; padding:0 !important;
             min-height:0 !important; height:auto !important; overflow:visible !important; }
  .nav,.topbar,.toolbar,.toast,#sigMask{ display:none !important; }
  .wrap{ max-width:none !important; margin:0 !important; padding:0 !important; }
  .sheet-wrap{ border:0 !important; border-radius:0 !important; overflow:visible !important; margin:0 !important; }
  .sheet{ min-width:0 !important; width:100% !important; border:1.5pt solid #000 !important; font-size:7.5pt !important;
          page-break-inside:avoid !important; break-inside:avoid !important; }
  .sheet td{ border:.6pt solid #000 !important; color:#000 !important; }
  col.c-day{ width:9.5mm; } col.c-t{ width:12.6mm; } col.c-h{ width:12.6mm; } col.c-r{ width:18mm; }
  .r-title td{ height:12mm; font-size:13pt; padding:1.5mm 2mm; }
  .r-title .en{ font-size:7pt; margin-top:.5mm; }
  .r-info td{ height:8mm; font-size:7pt; padding:.5mm 1mm; }
  .r-info2 td{ height:18mm; font-size:7pt; padding:.5mm 1mm; }
  .r-lbl .en{ font-size:6pt; }
  .r-val{ font-size:7pt; }
  .r-req{ font-size:6.5pt; line-height:1.3; }
  .eq-box{ padding:.8mm 1mm; }
  .eq-line{ font-size:6.5pt; line-height:1.35; gap:1mm; }
  .r-period td{ height:5mm; font-size:7.5pt; }
  .r-period .en{ font-size:5.5pt; margin-top:0; }
  .r-sub td{ height:8mm; font-size:6.5pt; line-height:1.1; }
  .r-sub .en{ font-size:5.5pt; }
  .r-day td{ height:8mm; }
  .r-last td{ height:13mm; }
  .c-day{ font-size:7.5pt; }
  .vin{ font-size:8pt; padding:0; -webkit-appearance:none; appearance:none; }
  .vin:focus,.rec-in:hover{ background:transparent !important; }
  .rec-in .plus{ display:none !important; }
  .rec-in{ height:100%; }
  .cfg-hint{ display:none !important; }
  td.disabled,.vin:disabled{ background:#fff !important; }
  .rec-img{ width:16mm; height:5.4mm; }
  .note{ font-size:6pt; line-height:1.3; padding:.8mm 1mm !important; }
  .sheet-head{ font-size:7.5pt; padding:0 0 1.5mm; }      /* 页眉跟着表格走，落在右上角 */
  .sheet td.struck{ background:#fff !important; }          /* 打印不铺灰底，只留斜线（省墨、与纸质表一致） */
  .stk-clip::before{ border-top-width:1px; }        /* 打印用整像素，线更干净；width:1em 随字号自动换算 */
}
</style>
</head>
<body>
<nav class="nav">
  <div class="brand">温湿度监测记录</div>
  <div class="sp"></div>
  <a href="/">设备大屏</a>
  <a href="/inspect">点检作业</a>
  <a href="/env" class="active">温湿度</a>
  <a href="/admin" id="nav_admin" style="display:none">管理后台</a>
  <span data-appver style="color:rgba(234,241,251,.45);font-size:11px;white-space:nowrap"></span>
  <a href="/logout">退出</a>
</nav>

<div class="wrap">
  <div class="topbar">
    <h1>🌡 温湿度监测记录</h1>
    <div class="sp"></div>
    <span class="muted tiny" id="hint"></span>
  </div>

  <div class="toolbar">
    <label>房间 <select id="room_sel"></select></label>
    <label>月份 <input type="month" id="ym_sel"></label>
    <a class="btn sm" id="go_inspect" href="/inspect" title="跳到本房间的设备点检表（设备维护保养记录）">🔧 本房间设备点检 →</a>
    <button class="btn sm" id="batch_btn" title="开启后，点击「记录员」格子即可连续电子签名，无需反复输密码">🔁 批量电子签名：关</button>
    <button class="btn sm" id="strike_btn" title="某天不需要填写时，把这一天整行划掉。开启后点某天的任意格子或日号即可；再点一次取消">— 划线标记：关</button>
    <button class="btn sm primary" id="save_btn">💾 保存</button>
    <button class="btn sm" id="print_btn">🖨 打印 / 另存PDF</button>
    <button class="btn sm ghost" id="csv_btn" style="display:none">⬇ 导出CSV</button>
    <span class="batch-tip" id="batch_tip"></span>
    <span class="batch-tip" id="strike_tip" style="color:#ffd166"></span>
  </div>

  <!-- 表头缺项提示（仅屏幕可见）：本房间还没填温湿度表头时，给管理员一个直达后台的入口 -->
  <div id="cfg_hint" class="cfg-hint"></div>

  <!-- 表单主体：屏幕录入与打印输出复用同一份 DOM -->
  <div class="sheet-wrap">
    <!-- 原表单页眉：Excel 里就是右对齐的「DEMO-QR-008 Rev.A0」，打印时落在页面右上角 -->
    <div class="sheet-head" id="sheet_head">DEMO-QR-008 Rev.A0</div>
    <table class="sheet" id="sheet">
      <colgroup id="cg"></colgroup>
      <tbody id="tb"></tbody>
    </table>
  </div>
</div>

<!-- 签名面板 -->
<div class="mask" id="sigMask">
  <div class="modal">
    <h3 id="sig_title">🖊 选择记录员电子签名</h3>
    <div class="sig-form">
      <select id="sig_signer"></select>
      <input type="password" id="sig_pw" placeholder="签名密码">
      <div class="sig-preview-box" id="sig_preview"><span class="empty">未选择签名人</span></div>
      <div class="sig-hint" id="sig_hint"></div>
      <!-- 划线单独一行：和「清除签名 / 电子签名」分开，避免误点 -->
      <div class="sig-actions left">
        <button class="btn ghost" id="sig_strike" onclick="strikeActiveDay()" title="该日整日无需记录：把这一天的温度 / 湿度 / 记录员整行划掉">— 本日无需记录（整行划掉）</button>
      </div>
      <div class="sig-actions">
        <button class="btn ghost" onclick="closeSig()">取消</button>
        <button class="btn danger" onclick="clearActiveSig()">清除签名</button>
        <button class="btn primary" id="sig_ok" onclick="confirmSign()">电子签名</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const api=(p,opt)=>fetch(p,Object.assign({credentials:'same-origin'},opt)).then(r=>r.json());
function toast(m,t){const e=$('#toast');e.textContent=m;e.className='toast show '+(t||'');setTimeout(()=>e.className='toast',2600);}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// 房间下拉选项：一律显示完整房间名；有分组的房间用 <optgroup> 归到组名之下。
// 用 optgroup 而不是给选项加前缀，是因为下拉收起时只显示选项文本——选项写完整房间名，
// 收起/展开都能看清是哪个房间，同时展开时仍能看出分组归属。
function roomOpts(list,cur,allLabel){
  const opt=r=>`<option value="${esc(r.name)}" ${r.name===cur?'selected':''}>${esc(r.name)}</option>`;
  const groups=[]; const plain=[];
  (list||[]).forEach(r=>{
    const g=String(r.group||'').trim();
    if(g){ let e=groups.find(x=>x.g===g); if(!e){ e={g:g,items:[]}; groups.push(e); } e.items.push(r); }
    else plain.push(r);
  });
  let h=(allLabel!=null)?`<option value="" ${cur===''?'selected':''}>${esc(allLabel)}</option>`:'';
  h+=groups.map(e=>`<optgroup label="${esc(e.g)}">${e.items.map(opt).join('')}</optgroup>`).join('');
  h+=plain.map(opt).join('');
  return h;
}

const localMonth=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;};
const daysInMonth=ym=>{const [y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate();};
const PERIODS=[['AM','上午  A.M.'],['PM','下午  P.M.'],['Night','晚上  Night']];

let ROOMS=[], SIGNERS=[], SIGMAP={}, CUR_ROOM='', CUR_YM=localMonth();
let STATE={cells:{}};
let ACTIVE_SIG_CELL=null, SIG_MODE='one';   // 'one' 单格电子签名 | 'batch' 开启批量
let STRIKE_MODE=false;                      // 划线模式：点某天任意格 = 该日整行划掉

// 原表单页眉右上角的表单编号（各房间温湿度表同一编号，取自原始 xlsx 的页眉右对齐内容）
const FORM_DOCNO='DEMO-QR-008 Rev.A0';
// 划线的标记容器：空的 span，横杠由 .stk-clip::before 画（见顶部 CSS）
const STRIKE_MARK='<span class="stk-clip"></span>';
let BATCH=null;                             // {id,name,img} 批量电子签名凭据

// 角色：管理员才显示 CSV 导出
(async()=>{try{const me=await api('/api/admin/me'); if(me&&me.ok&&me.role==='admin'){ $('#csv_btn').style.display=''; }}catch(e){}})();

async function init(){
  try{ ROOMS=await api('/api/rooms'); }catch(e){ ROOMS=[]; }
  const rp=new URLSearchParams(location.search).get('room');
  try{ const sr=sessionStorage.getItem('selected_room'); if(rp&&ROOMS.some(r=>r.name===rp)) CUR_ROOM=rp; else if(sr&&ROOMS.some(r=>r.name===sr)) CUR_ROOM=sr; else CUR_ROOM=ROOMS.length?ROOMS[0].name:''; }catch(e){ CUR_ROOM=ROOMS.length?ROOMS[0].name:''; }
  $('#room_sel').innerHTML=roomOpts(ROOMS,CUR_ROOM)||'<option>—</option>';
  $('#ym_sel').value=CUR_YM;
  syncRoomLinks();
  try{ SIGNERS=await api('/api/signers/public'); SIGMAP={}; SIGNERS.forEach(s=>SIGMAP[s.id]={name:s.name,img:s.signature_image||'',imgv:s.signature_image_v||''}); }catch(e){ SIGNERS=[]; }
  $('#sig_signer').innerHTML='<option value="">（选择记录员…）</option>'+SIGNERS.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
  $('#sig_signer').onchange=updateSigPreview;
  await loadRecord();
}
$('#room_sel').onchange=async()=>{ CUR_ROOM=$('#room_sel').value; try{sessionStorage.setItem('selected_room',CUR_ROOM);}catch(e){} syncRoomLinks(); await loadRecord(); };
$('#ym_sel').onchange=async()=>{ CUR_YM=$('#ym_sel').value; syncRoomLinks(); await loadRecord(); };

// 房间 → 其他页面的跳转链接（同房间的设备点检表 / 批量打印），保持房间上下文一致
function syncRoomLinks(){
  const q=encodeURIComponent(CUR_ROOM||'');
  const a=$('#go_inspect'); if(a) a.href='/inspect?room='+q;
  const b=$('#go_printall'); if(b) b.href='/print-all?room='+q+'&month='+encodeURIComponent(CUR_YM)+'&auto=1';
}

async function loadRecord(){
  $('#hint').textContent='加载中…';
  let rec={cells:{}};
  try{ rec=await api('/api/env-records?room='+encodeURIComponent(CUR_ROOM)+'&ym='+CUR_YM); }catch(e){}
  STATE.cells=rec.cells||{};
  render();
  $('#hint').textContent=rec.updated_at?('上次保存：'+fmtTime(rec.updated_at)):'尚未保存';
}
function fmtTime(t){ return String(t).replace('T',' ').slice(0,19); }
/* 表头三项（监测仪器 / 被监测设备 / 综合要求）来自后台「房间管理」，缺项时给管理员一个补填入口。
   只提示、不阻断：缺「综合温湿度要求」时超限标红会失效，所以要说明。 */
function renderCfgHint(cfg){
  const el=$('#cfg_hint'); if(!el) return;
  const miss=[];
  if(!String(cfg.thermo_apparatus||'').trim()) miss.push('监测仪器型号和编号');
  if(!String(cfg.thermo_equipment||'').trim()) miss.push('被监测的设备型号和编号');
  if(!String(cfg.thermo_requirement||'').trim()) miss.push('综合温湿度要求');
  if(!miss.length){ el.className='cfg-hint'; el.innerHTML=''; return; }
  const noReq=!String(cfg.thermo_requirement||'').trim();
  el.className='cfg-hint show';
  el.innerHTML='⚠️ 本房间温湿度表头还有 <b>'+miss.length+'</b> 项未填写：'+miss.map(esc).join('、')+
    ' &nbsp;<a href="/admin?tab=room&room='+encodeURIComponent(CUR_ROOM)+'" target="_blank" rel="noopener">→ 去后台补填</a>'+
    '<div class="sub">保存后回到本页刷新即可，已录入的数据和签名不受影响。'+
    (noReq?'（缺「综合温湿度要求」时，温度/湿度超限不会自动标红）':'')+'</div>';
}
function roomCfg(){ return ROOMS.find(r=>r.name===CUR_ROOM)||{}; }

/* ===== 温湿度限值：从房间「综合温湿度要求」文本解析，解析不到就不校验 ===== */
let LIMITS=null;
function parseLimits(txt){
  const s=String(txt||'');
  // 兼容纸质表写法：既可写「温度：10℃~35℃」，也可写「温度要求：10℃~35℃」；值为「—」时视为未设限
  const t=s.match(/温度(?:要求)?\s*[：:]\s*(-?\d+(?:\.\d+)?)\s*(?:℃|°C)?\s*[-~—～]\s*(-?\d+(?:\.\d+)?)/);
  const h=s.match(/湿度(?:要求)?\s*[：:]\s*(≤|<=|<|不超过)\s*(\d+(?:\.\d+)?)/);
  if(!t&&!h) return null;
  return { tMin:t?parseFloat(t[1]):null, tMax:t?parseFloat(t[2]):null, hMax:h?parseFloat(h[2]):null };
}
function badTemp(v){ if(!LIMITS||LIMITS.tMin==null) return false; const n=parseFloat(v); if(isNaN(n)) return false; return n<LIMITS.tMin||n>LIMITS.tMax; }
function badHum(v){ if(!LIMITS||LIMITS.hMax==null) return false; const n=parseFloat(v); if(isNaN(n)) return false; return n>LIMITS.hMax; }

/* ===== 渲染（唯一一份 DOM） ===== */
function render(){
  const cfg=roomCfg();
  LIMITS=parseLimits(cfg.thermo_requirement);
  renderCfgHint(cfg);
  const hd=$('#sheet_head'); if(hd) hd.textContent=FORM_DOCNO;   // 页眉：屏幕与打印共用同一个节点
  $('#cg').innerHTML='<col class="c-day">'+('<col class="c-t"><col class="c-h"><col class="c-r">').repeat(3)
                    +'<col class="c-day">'+('<col class="c-t"><col class="c-h"><col class="c-r">').repeat(3);
  const dim=daysInMonth(CUR_YM);
  let h='';
  h+=`<tr class="r-title"><td colspan="20">温湿度监测记录<span class="en">Temperature and Humidity Monitoring Record</span></td></tr>`;
  h+=`<tr class="r-info">
        <td colspan="4" class="r-lbl">监测仪器型号和编号<span class="en">Monitoring Apparatus Model and No.</span></td>
        <td colspan="3" class="r-val">${esc(cfg.thermo_apparatus||'—')}</td>
        <td colspan="3" class="r-lbl">房间名称/编号<span class="en">The Name /No. of Room</span></td>
        <td colspan="4" class="r-val">${esc(CUR_ROOM||'—')}</td>
        <td colspan="3" class="r-lbl">监测年月<span class="en">Monitoring Year and Month</span></td>
        <td colspan="3" class="r-val">${esc(CUR_YM?CUR_YM.replace('-','.'):'—')}</td>
      </tr>`;
  h+=`<tr class="r-info2">
        <td colspan="4" class="r-lbl">被监测的设备型号和编号<span class="en">Monitored Equipment(s) Model and No.</span></td>
        <td colspan="10" class="eq-box">${renderEq(cfg.thermo_equipment)}</td>
        <td colspan="3" class="r-lbl">综合温湿度要求<span class="en">Integrated Requirement</span></td>
        <td colspan="3" class="r-req">${esc(cfg.thermo_requirement||'—')}</td>
      </tr>`;
  h+=`<tr class="r-period"><td rowspan="2">日<span class="en">Day</span></td>`
     +PERIODS.map(p=>`<td colspan="3">${esc(p[1])}</td>`).join('')
     +`<td rowspan="2">日<span class="en">Day</span></td>`
     +PERIODS.map(p=>`<td colspan="3">${esc(p[1])}</td>`).join('')+`</tr>`;
  h+=`<tr class="r-sub">`
     +PERIODS.map(()=>`<td>温度<span class="en">Temperature ℃</span></td><td>湿度<span class="en">Humidity %RH</span></td><td>记录员 Recorder</td>`).join('')
     +PERIODS.map(()=>`<td>温度<span class="en">Temperature ℃</span></td><td>湿度<span class="en">Humidity %RH</span></td><td>记录员 Recorder</td>`).join('')+`</tr>`;
  for(let i=0;i<16;i++){
    const L=i+1, R=17+i;
    h+=`<tr class="r-day${i===15?' r-last':''}">`;
    h+=dayCellHTML(L,dim)+cellsHTML(L,dim);
    if(i<15){ h+=dayCellHTML(R,dim)+cellsHTML(R,dim); }
    else{
      h+=`<td colspan="10" class="note">注：温、湿度记录应在上班后 1 小时之内和检测工作开始前进行。Temperature and humidity shall be recorded within one hour after the beginning of the work and before the beginning of the testing work.</td>`;
    }
    h+='</tr>';
  }
  $('#tb').innerHTML=h;
  bind();
  SIGFIT.fit($('#tb'));   // 记录员格是横向格 → 自动取横版签名
}
function renderEq(text){
  let lines=String(text||'').split('\n').map(s=>s.trim()).filter(Boolean);
  if(!lines.length) return '<span style="color:#999">—</span>';
  if(lines.length===1 && /[；]/.test(lines[0]) && !/\|/.test(lines[0])) lines=lines[0].split('；').map(s=>s.trim()).filter(Boolean);
  return lines.map(ln=>{
    if(ln.indexOf('|')<0) return `<div class="eq-line" style="grid-template-columns:1fr"><span>${esc(ln)}</span></div>`;
    const parts=ln.split('|').map(s=>s.trim()).slice(0,3);
    const cols=parts.length>=3?'0.9fr 1.05fr 1.05fr':`repeat(${parts.length},1fr)`;
    return `<div class="eq-line" style="grid-template-columns:${cols}">${parts.map(p=>`<span>${esc(p)}</span>`).join('')}</div>`;
  }).join('');
}
/* 某日是否已划线：只要该日任一时段带 strike 即视为整行划掉 */
function dayStruck(day){
  return PERIODS.some(function(p){ const c=STATE.cells[day+'_'+p[0]]; return !!(c&&c.strike); });
}
/* 划线 / 取消划线：整天三时段一起处理（温度、湿度、记录员都要杠掉） */
function toggleStrike(day){
  if(!day) return;
  const on=dayStruck(day);
  if(on){
    PERIODS.forEach(function(p){ const k=day+'_'+p[0]; if(STATE.cells[k]) delete STATE.cells[k].strike; });
  }else{
    const has=PERIODS.some(function(p){
      const c=STATE.cells[day+'_'+p[0]]||{};
      return !!(String(c.temp||'').trim()||String(c.humidity||'').trim()||c.recorder||c.signature_image);
    });
    if(has && !confirm('第 '+day+' 天已经有记录。\n划线表示这一日无需记录，会清除该日全部温度 / 湿度 / 电子签名，确定吗？')) return;
    PERIODS.forEach(function(p){ STATE.cells[day+'_'+p[0]]={strike:1}; });
  }
  render();
  toast(on?('已取消第 '+day+' 天的划线'):('第 '+day+' 天已划掉（无需记录）'),'ok');
}
/* 日号格：点一下把这一行整行划掉，再点取消 */
function dayCellHTML(day,dim){
  const off = day>dim ? ' disabled' : '';
  const st = dayStruck(day), cls = off + (st?' struck':'');
  // 日号格不画斜线：日期数字必须保持可读，斜线只落在温度 / 湿度 / 记录员那 9 格
  return `<td class="c-day${cls}" data-day="${day}"${off?'':' title="某日无需记录时点这里，把整行划掉；再点一次取消"'}>`
       + `${day}</td>`;
}
function cellsHTML(day,dim){
  const off = day>dim ? ' disabled' : '';
  const st = dayStruck(day);
  const stc = st ? ' struck' : '';
  const dis = (off||st) ? ' disabled' : '';   // 已划线的日子不允许再录入
  const svg = st ? STRIKE_MARK : '';
  let out='';
  for(const [pk] of PERIODS){
    const k=day+'_'+pk, c=STATE.cells[k]||{};
    const m=SIGMAP[c.recorder]||{};
    const img = st ? '' : (c.signature_image || m.img || '');
    const imgv = st ? '' : (c.signature_image_v || m.imgv || img);
    out+=`<td class="c-t${off}${stc}" data-day="${day}"><input class="vin${badTemp(c.temp)?' bad':''}" data-k="${k}" data-f="temp" value="${esc(st?'':c.temp)}" placeholder="" autocomplete="off" inputmode="decimal"${dis}>${svg}</td>`;
    out+=`<td class="c-h${off}${stc}" data-day="${day}"><input class="vin${badHum(c.humidity)?' bad':''}" data-k="${k}" data-f="humidity" value="${esc(st?'':c.humidity)}" placeholder="" autocomplete="off" inputmode="decimal"${dis}>${svg}</td>`;
    out+=`<td class="c-r${off}${stc}" data-sig="${k}" data-day="${day}"${(off||st)?'':' title="点击电子签名'+(img?'，右键清除':'')+'"'}><div class="rec-in">`
       + (img?`<img class="rec-img" src="${img}"${SIGFIT.attrs(img,imgv)} alt="">`:(st?'':'<span class="plus">＋</span>'))
       + `</div>${svg}</td>`;
  }
  return out;
}
function bind(){
  $$('#tb input.vin').forEach(el=>{
    el.oninput=e=>{
      const k=e.target.dataset.k, f=e.target.dataset.f, v=e.target.value;
      STATE.cells[k]=STATE.cells[k]||{};
      STATE.cells[k][f]=v;
      if(f==='temp') e.target.classList.toggle('bad', badTemp(v));
      if(f==='humidity') e.target.classList.toggle('bad', badHum(v));
    };
  });
  // 事件按「格」统一分派：
  //   日号格      → 始终可划线/取消（最直观的入口）
  //   已划线 / 划线模式 → 点任意格都是划线开关
  //   普通记录员格 → 电子签名（右键清除）
  $$('#tb td[data-day]').forEach(td=>{
    if(td.classList.contains('disabled')) return;   // 当月不存在的日期不可操作
    const day=parseInt(td.dataset.day,10)||0;
    const isRec=!!td.dataset.sig;
    if(td.classList.contains('c-day')){ td.onclick=()=>toggleStrike(day); return; }
    if(td.classList.contains('struck')){            // 已划线的格子：点一下取消划线
      td.onclick=()=>toggleStrike(day);
      if(isRec) td.oncontextmenu=e=>{ e.preventDefault(); toggleStrike(day); };
      return;
    }
    if(isRec){
      const k=td.dataset.sig;
      // 是否走划线，必须在「点击时」判断：bind() 只在渲染时跑一次，写死会用到过期的 STRIKE_MODE
      td.onclick=()=>{ if(STRIKE_MODE) toggleStrike(day); else openSig(k); };
      td.oncontextmenu=e=>{ e.preventDefault(); if(STRIKE_MODE) toggleStrike(day); else clearSigOf(k); };
      return;
    }
    // 温度 / 湿度格：普通模式下点击留给输入框，划线模式才接管
    td.onclick=()=>{ if(STRIKE_MODE) toggleStrike(day); };
  });
}

/* ===== 签名 ===== */
function openSig(k){
  const c=STATE.cells[k]||{};
  if(SIG_MODE==='batch' && BATCH){           // 批量模式：直接电子签名
    STATE.cells[k]=STATE.cells[k]||{};
    STATE.cells[k].recorder=BATCH.id; STATE.cells[k].signature_image=BATCH.img; STATE.cells[k].signature_image_v=BATCH.imgv;
    paintOne(k); return;
  }
  ACTIVE_SIG_CELL=k; SIG_MODE='one';
  $('#sig_strike').style.display='';                 // 单格模式下才提供「本日无需记录」
  $('#sig_title').textContent='🖊 选择记录员电子签名 — '+k.replace('_','日 ');
  $('#sig_signer').value=c.recorder||'';
  $('#sig_pw').value='';
  $('#sig_hint').innerHTML='电子签名后可点上方「批量电子签名」连续签名，不必反复输入密码；右键记录员格可清除。'
    +'<br>该日整日不需要记录时，点 <b>「— 本日无需记录」</b>把这一行划掉（也可直接点日号格）。';
  updateSigPreview();
  $('#sigMask').classList.add('show');
}
function closeSig(){ ACTIVE_SIG_CELL=null; $('#sigMask').classList.remove('show'); }
/* 签名弹窗里的「本日无需记录」：把该日整行划掉 */
function strikeActiveDay(){
  if(!ACTIVE_SIG_CELL){ toast('请先在表格里点某一天的记录员格','err'); return; }
  const day=parseInt(String(ACTIVE_SIG_CELL).split('_')[0],10)||0;
  closeSig();                 // 先关弹窗，confirm 才不会被遮住
  toggleStrike(day);
}
function updateSigPreview(){
  const id=$('#sig_signer').value, box=$('#sig_preview');
  if(!id||!SIGMAP[id]){ box.innerHTML='<span class="empty">未选择签名人</span>'; return; }
  const s=SIGMAP[id];
  box.innerHTML = s.img ? `<img src="${s.img}" alt="">` : `<span class="empty">${esc(s.name)}（无电子签名图）</span>`;
}
function paintOne(k){
  const td=$(`#tb td[data-sig="${k}"]`); if(!td) return;
  const c=STATE.cells[k]||{};
  const m=SIGMAP[c.recorder]||{};
  const img=c.signature_image||m.img||'';
  const imgv=c.signature_image_v||m.imgv||img;
  td.querySelector('.rec-in').innerHTML = img?`<img class="rec-img" src="${img}"${SIGFIT.attrs(img,imgv)} alt="">`:'<span class="plus">＋</span>';
  td.title = img?'点击电子签名，右键清除':'点击电子签名';
  if(img) SIGFIT.fit(td);
}
function clearSigOf(k){
  const c=STATE.cells[k]; if(!c||(!c.recorder&&!c.signature_image)) return;
  delete c.recorder; delete c.signature_image; delete c.signature_image_v;
  paintOne(k); toast('已清除 '+k.replace('_','日 ')+' 的电子签名');
}
async function confirmSign(){
  if(SIG_MODE==='batch') return confirmBatch();
  if(!ACTIVE_SIG_CELL){ closeSig(); return; }
  const id=$('#sig_signer').value, pw=$('#sig_pw').value;
  if(!id){ toast('请选择签名人','err'); return; }
  if(!pw){ toast('请输入签名密码','err'); return; }
  const btn=$('#sigMask .btn.primary'); btn.disabled=true;
  const r=await api('/api/env-records/sign-cell',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({signer_id:id,password:pw})});
  btn.disabled=false;
  if(r.error){ toast(r.error,'err'); return; }
  const k=ACTIVE_SIG_CELL;
  STATE.cells[k]=STATE.cells[k]||{};
  STATE.cells[k].recorder=r.signer_id||id;
  STATE.cells[k].signature_image=r.signature_image||'';
  STATE.cells[k].signature_image_v=r.signature_image_v||r.signature_image||'';
  paintOne(k);
  closeSig();
  toast('已电子签名：'+(r.name||''),'ok');
}
function clearActiveSig(){
  if(!ACTIVE_SIG_CELL){ closeSig(); return; }
  clearSigOf(ACTIVE_SIG_CELL);
  closeSig();
}
$('#sigMask').onclick=e=>{ if(e.target.id==='sigMask') closeSig(); };

/* ===== 划线标记：把「某些日期不需要填写」的整行杠掉 ===== */
$('#strike_btn').onclick=()=>{
  STRIKE_MODE=!STRIKE_MODE;
  const b=$('#strike_btn');
  b.classList.toggle('on',STRIKE_MODE);
  b.textContent='— 划线标记：'+(STRIKE_MODE?'开':'关');
  document.body.classList.toggle('strike-mode',STRIKE_MODE);
  $('#strike_tip').textContent=STRIKE_MODE?'划线模式：点某一天的任意格子或日号 = 整行划掉（该日无需记录），再点一次取消':'';
  toast(STRIKE_MODE?'划线模式已开启：点某一天即可划掉该行':'已关闭划线模式');
};

/* ===== 批量电子签名：一次性校验密码，之后点格即签名 ===== */
$('#batch_btn').onclick=()=>{
  if(SIG_MODE==='batch'){           // 关闭
    SIG_MODE='one'; BATCH=null;
    $('#batch_btn').classList.remove('on'); $('#batch_btn').textContent='🔁 批量电子签名：关';
    $('#batch_tip').textContent=''; toast('已关闭批量电子签名');
    return;
  }
  ACTIVE_SIG_CELL=null; SIG_MODE='batch';
  $('#sig_strike').style.display='none';             // 批量模式还没指定哪一天
  $('#sig_title').textContent='🔁 开启批量电子签名';
  $('#sig_signer').value=BATCH?BATCH.id:'';
  $('#sig_pw').value='';
  $('#sig_hint').innerHTML='校验通过后，点击任意「记录员」格即可直接电子签名，无需再次输入密码。再次点击工具栏按钮可关闭。';
  updateSigPreview();
  $('#sigMask').classList.add('show');
};
async function confirmBatch(){
  const id=$('#sig_signer').value, pw=$('#sig_pw').value;
  if(!id){ toast('请选择签名人','err'); return; }
  if(!pw){ toast('请输入签名密码','err'); return; }
  const btn=$('#sig_ok'); btn.disabled=true;
  const r=await api('/api/env-records/sign-cell',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({signer_id:id,password:pw})});
  btn.disabled=false;
  if(r.error){ toast(r.error,'err'); return; }
  BATCH={ id:r.signer_id||id, name:r.name||'', img:r.signature_image||'', imgv:r.signature_image_v||r.signature_image||'' };
  $('#batch_btn').classList.add('on'); $('#batch_btn').textContent='🔁 批量电子签名：开';
  $('#batch_tip').textContent='批量模式：点击记录员格即电子签名（'+BATCH.name+'），右键清除';
  closeSig();
  toast('批量电子签名已开启：'+BATCH.name,'ok');
}

/* ===== 保存 / 打印 / 导出 ===== */
$('#save_btn').onclick=async()=>{
  if(!CUR_ROOM){ toast('请先选择房间','err'); return; }
  $('#save_btn').disabled=true;
  const r=await api('/api/env-records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room:CUR_ROOM,ym:CUR_YM,cells:STATE.cells})});
  $('#save_btn').disabled=false;
  if(r.error){ toast(r.error,'err'); return; }
  toast('已保存 '+CUR_ROOM+' '+CUR_YM,'ok');
  $('#hint').textContent='上次保存：'+fmtTime(r.updated_at||new Date().toISOString());
};
$('#print_btn').onclick=()=>{ window.print(); };
$('#csv_btn').onclick=()=>{ location.href='/api/admin/env-records/export-csv?room='+encodeURIComponent(CUR_ROOM)+'&ym='+CUR_YM; toast('已开始导出 CSV','ok'); };

fetch('/api/version').then(r=>r.json()).then(v=>{$$('[data-appver]').forEach(e=>e.textContent=v.version);}).catch(()=>{});
init();
</script>
