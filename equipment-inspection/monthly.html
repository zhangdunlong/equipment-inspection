<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月度点检表 · 打印视图</title>
<style>
  :root{
    --pink:#ff5fa2; --cyan:#1aa6c4; --ink:#222; --line:#000;
    --glass:rgba(255,255,255,.55);
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,#fde7f3 0%,#e6f6fb 100%);
  }
  .toolbar{
    position:sticky; top:0; z-index:20; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    padding:12px 18px; margin:0 0 18px;
    background:var(--glass); backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,95,162,.3);
    box-shadow:0 4px 18px rgba(255,95,162,.12);
  }
  .toolbar h1{font-size:16px; margin:0 8px 0 0; color:var(--pink); letter-spacing:.5px}
  .toolbar label{font-size:13px; color:#555}
  .toolbar select, .toolbar input[type=month]{
    font-size:14px; padding:6px 10px; border-radius:10px; border:1px solid #e3c6d8;
    background:#fff; color:#333; outline:none;
  }
  /* 展开列表的选项要单独给色：Windows 上系统绘制选项时不认 select 的 color，
     不写这行「全部设备 / 各台设备」在部分机型上会是浅灰字，几乎看不见。 */
  .toolbar select option{ color:#333; background:#fff; }
  .btn{
    cursor:pointer; border:none; border-radius:10px; padding:8px 16px; font-size:14px; font-weight:600;
    color:#fff; background:linear-gradient(135deg,var(--pink),var(--cyan));
    box-shadow:0 4px 12px rgba(255,95,162,.35); transition:.15s;
  }
  .btn:hover{transform:translateY(-1px); filter:brightness(1.05)}
  .btn.ghost{background:#fff; color:var(--pink); border:1px solid var(--pink)}
  .spacer{flex:1}
  .hint{font-size:12px;color:#888}

  #forms{display:flex; flex-direction:column; align-items:center; gap:18px; padding:0 12px 40px}

  /* ===== 单张点检表（与 DEMO-QR-032 版式一致） ===== */
  .form{
    width:100%; max-width:1180px; background:#fff;
    border:2px solid var(--line); border-radius:6px; overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,.08);
  }
  .f-title{
    text-align:center; font-size:20px; font-weight:800; padding:10px 6px 2px; letter-spacing:1px;
  }
  .f-title .en{font-size:11px; font-weight:500; color:#666; letter-spacing:.5px}
  .f-head{position:relative; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    display:flex; flex-wrap:wrap; align-items:center; gap:4px 26px; padding:8px 14px; font-size:13px}
  .f-head .fh-code{position:absolute; right:8mm; top:5mm; font-size:8pt; color:#888; font-weight:600; letter-spacing:.5px; pointer-events:none;}
  .f-head .yr, .f-head .mo{font-weight:700}
  .f-meta{display:flex; flex-wrap:wrap; gap:4px 26px; align-items:center}
  .f-meta b{font-weight:700; border-bottom:1px solid #999; padding:0 8px; min-width:40px; display:inline-block; text-align:center}
  .f-meta .no{
    font:inherit; font-weight:700; border:none; border-bottom:1px solid #999;
    width:120px; text-align:center; outline:none; padding:0 4px;
  }
  table.grid{border-collapse:collapse; width:100%; font-size:12px; table-layout:fixed}
  table.grid th, table.grid td{border:1px solid var(--line); padding:3px 2px; text-align:center; vertical-align:middle}
  .c-sn{width:34px}
  .c-content{width:150px; text-align:left !important; white-space:pre-line; line-height:1.15}
  .c-freq{width:46px}
  table.grid thead th{background:#f3f3f3; font-weight:700}
  table.grid tbody td.cell{font-size:13px; font-weight:700}
  td.ok{color:#0a8f3c}
  td.ng{color:#d11; }
  .f-foot{border-top:1px solid var(--line); font-size:12px; padding:6px 12px; display:flex; flex-direction:column; gap:3px}
  .f-foot .row{display:flex; gap:8px}
  .f-foot .lbl{font-weight:700; white-space:nowrap}
  .f-foot .legend{color:#777; font-size:11px; border-top:1px dashed #ccc; padding-top:4px; margin-top:2px}
  .empty{color:#999; font-style:italic}

  /* ===== 打印样式 ===== */
  @page{ size:A4 landscape; margin:4mm 4mm; }
  @media print{
    body{background:#fff}
    .toolbar{display:none !important}
    /* 文档编号放在每个 form 顶部最右（流式元素） */
    .print-code{display:block; text-align:right; font-size:8pt; color:#333; font-weight:600; letter-spacing:.5px; margin-bottom:1pt; padding-right:1mm}
    .f-head .fh-code{display:none !important}
    #forms{gap:0; padding:0; margin:0}
    /* 外框：`.form` 是**外层 div**，其边框不与 table 参与 border-collapse，
       会和表格首列单元格的边框直接叠加。内线 2.5pt（实测 1.70pt）时取 2.5pt → 叠加后约 3.4pt。 */
    .form{box-shadow:none; border:2.5pt solid #000; max-width:none; width:100%;
      page-break-inside:avoid; break-inside:avoid; page-break-after:always; border-radius:0; display:block}
    .form:last-child{page-break-after:auto}
    .f-title{padding:3pt 6pt 0 !important; font-size:12pt !important}
    .f-title .en{font-size:7pt !important}
    .f-head{padding:2pt 10pt !important; font-size:8.5pt !important; line-height:1.25 !important}
    .f-head .yr, .f-head .mo{font-weight:700}
    table.grid{ border-collapse:collapse; table-layout:fixed; font-size:7.5pt !important; page-break-inside:avoid; break-inside:avoid; }
    /* 内线：屏幕态 1px（沿用 var(--line)）实测只有 0.48~0.61pt（≈0.2mm）。
       1.5pt（实测 1.16pt）在纸上够清晰，但在 Chrome **打印预览**里会被缩放（A4 横向缩到约 690px）
       压到 1 屏幕像素以下而发灰，看起来像「没渲染」。
       实测只有 2.5pt（1.70pt）在预览尺度下才明显变黑。 */
    table.grid th, table.grid td{ border:2.5pt solid #000 !important; }
    /* 填写横线：打印块里原来**没有**这条规则，于是沿用屏幕态的 `1px solid #999`
       —— 既细（≈0.75pt，比内线 2.5pt 细 3.3 倍）又是灰色，与黑色格线并排时最扎眼。
       全站三档线宽统一：外框 4.5pt ／ 表格内线 2.5pt ／ 填写横线 1.5pt。 */
    .f-meta b{ border-bottom:1.5pt solid #000 !important; }
    table.grid thead th{ background:#eee !important; padding:.8pt 1pt !important; font-size:6.5pt !important; }
    table.grid tbody td{ padding:.3pt 1pt !important; vertical-align:middle !important; height:18pt; box-sizing:border-box; }
    table.grid .c-sn{ width:14pt !important; font-size:6.5pt; }
    table.grid .c-content{ width:195pt !important; font-size:7.5pt !important; line-height:1.25 !important; white-space:normal !important; word-break:break-word !important; }
    table.grid .c-freq{ width:20pt !important; font-size:5.5pt !important; }
    table.grid .cell{ font-weight:700 !important; font-size:7.5pt !important; }
    .f-foot{border-top:1px solid #000; font-size:8pt; padding:3px 12px; gap:2px; line-height:1.3}
    .f-foot .legend{font-size:8pt; border-top:1px dashed #000; padding-top:2px}
    td.ok, td.ng{color:#000 !important}
  }
</style>
</head>
<body>
  <div class="toolbar">
    <h1>📋 月度点检表 · 打印</h1>
    <label>月份 <input type="month" id="month"></label>
    <label>设备 <select id="dev"></select></label>
    <button class="btn" id="go">生成预览</button>
    <button class="btn ghost" id="print">🖨 打印 / 另存PDF</button>
    <span class="spacer"></span>
    <span class="hint">编号 No. 可手改后打印 · 每表自动单页</span>
  </div>

  <div id="forms"><div class="empty">选择月份与设备后点击「生成预览」</div></div>

<script src="/assets/dept.js"></script>
<script>
const $ = s => document.querySelector(s);
// 统一请求：任何情况下都返回对象，绝不 reject（原实现对网络异常 reject，且 401 不跳登录页）
const api=async(p,opt)=>{
  let res;
  try{ res=await fetch(p,Object.assign({credentials:'same-origin'},opt)); }
  catch(e){ const m='网络异常：连不上服务，请检查网络或确认服务在运行'; console.warn('[api] '+p,m,e); return { error:m }; }
  if(res.status===401){
    try{ location.href='/login?next='+encodeURIComponent(location.pathname+location.search); }catch(e2){}
    return { error:'登录已失效，正在跳转登录页…' };
  }
  let data=null;
  try{ data=await res.json(); }catch(e){ data=null; }
  if(!res.ok) return { error:(data&&(data.error||data.message))||('请求失败（HTTP '+res.status+'）') };
  return data==null?{}:data;
};
// 取「数组」的便捷入口：接口出错时 api 返回 { error:'…' }，
// 直接拿去 .map()/.filter() 会抛「is not a function」把整段渲染打断。
// 这里统一归一成空数组，并把原因写进控制台便于排查。
const apiList=async p=>{
  const r=await api(p);
  if(Array.isArray(r)) return r;
  console.warn('[apiList] 未取到数组：'+p, (r&&r.error)||r);
  return [];
};
let DEVICES=[], ROOM_SCOPE=null;  // ROOM_SCOPE：本科室房间名集合（null = 不限，看全部）

function initMonth(){
  const now=new Date();
  const y=now.getFullYear(), m=String(now.getMonth()+1).padStart(2,'0');
  $('#month').value = `${y}-${m}`;
}

async function loadDevices(){
  // 科室过滤：管理员 / 未设科室的老账号看全部；设了科室的普通用户只看本科室房间的设备
  try{ if(window.DEPT) await DEPT.load(); }catch(e){}
  DEVICES = await apiList('/api/devices');
  if(window.DEPT && !DEPT.canSeeAll()){
    let rooms=[]; try{ rooms=DEPT.filterRooms(await api('/api/rooms')); }catch(e){ rooms=[]; }
    ROOM_SCOPE=new Set(rooms.map(r=>r.name));
    DEVICES=DEVICES.filter(d=>ROOM_SCOPE.has(String(d.location||'').trim()));
  }
  const sel=$('#dev');
  sel.innerHTML = '<option value="0">全部设备</option>' +
    DEVICES.map(d=>`<option value="${d.id}">${esc(d.no)} · ${esc(d.name)}</option>`).join('');
}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function render(){
  const month=$('#month').value;
  if(!month){ alert('请选择月份'); return; }
  let data;
  try{ data = await api('/api/monthly?month='+encodeURIComponent(month)); }
  catch(e){ $('#forms').innerHTML='<div class="empty">加载失败：'+e+'</div>'; return; }
  const sel=+$('#dev').value;
  let devs = data.devices||[];
  if(sel) devs = devs.filter(d=>d.id===sel);
  else if(ROOM_SCOPE) devs = devs.filter(d=>ROOM_SCOPE.has(String(d.location||'').trim()));  // 「全部设备」也限于本科室
  devs = devs.filter(d=>(d.items||[]).length);   // 无检查项的设备（如已改专项表的显微镜）不出表
  const [yy,mm]=month.split('-');
  const box=$('#forms'); box.innerHTML='';
  if(!devs.length){ box.innerHTML='<div class="empty">该月 / 该设备暂无数据</div>'; return; }
  for(const d of devs){ box.appendChild(buildForm(d, yy, mm)); }
}

function buildForm(d, yy, mm){
  const dim = new Date(+yy, +mm, 0).getDate();
  const f=document.createElement('div'); f.className='form';

  let head='<th class="c-sn">序号<br>SN</th><th class="c-content">内容<br>Contents</th><th class="c-freq">频率<br>Frequency</th>';
  for(let day=1; day<=dim; day++) head+=`<th>${day}</th>`;

  let body='';
  const items = d.items||[];
  const dailyItems=items.filter(it=>it.frequency!=='每月');
  const monthlyItems=items.filter(it=>it.frequency==='每月');
  // 打印用行高：A4 横版单页约束 —— 每台设备每月必须正好一页
  // 可用高度 ≈ 567pt；固定开销（标题+表头+页脚+边框）≈ 150pt；剩余 ≈ 342pt 均分给内容行
  const totalRowCount = Math.max(1, dailyItems.length + monthlyItems.length);
  const dailyRowPt = Math.max(12, Math.min(32, Math.floor(350 / totalRowCount)));
  const monthlyRowPt = Math.max(16, dailyRowPt + 4);
  if(!items.length){ body='<tr><td colspan="'+(dim+3)+'" class="empty">无点检项</td></tr>'; }
  for(const it of dailyItems){
    let row=`<tr style="height:${dailyRowPt}pt"><td class="c-sn">${it.sn}</td><td class="c-content">${esc(it.content)}</td><td class="c-freq">${esc(it.frequency)}</td>`;
    for(let day=1; day<=dim; day++){
      const dd=`${yy}-${mm}-${String(day).padStart(2,'0')}`;
      const cell=d.days?d.days[dd]:null;
      let mark='';
      if(cell){ const st=cell.bySn?cell.bySn[it.sn]:null; mark = st==='ng'?'×':(st==='ok'?'√':''); }
      const cls = mark==='×'?'ng':(mark==='√'?'ok':'');
      row+=`<td class="cell ${cls}">${mark}</td>`;
    }
    row+='</tr>';
    body+=row;
  }
  for(const it of monthlyItems){
    let status='';
    for(let day=1; day<=dim; day++){
      const dd=`${yy}-${mm}-${String(day).padStart(2,'0')}`;
      const cell=d.days?d.days[dd]:null;
      if(cell&&cell.bySn&&cell.bySn[it.sn]){
        const s=cell.bySn[it.sn];
        if(s==='ng'){status='×';break;}
        if(s==='ok'&&status!=='×')status='√';
      }
    }
    const cls = status==='×'?'ng':(status==='√'?'ok':'');
    body+=`<tr style="height:${monthlyRowPt}pt"><td class="c-sn">${it.sn}</td><td class="c-content">${esc(it.content)}</td><td class="c-freq">${esc(it.frequency)}</td><td class="cell ${cls}" colspan="${dim}">${status}</td></tr>`;
  }

  // 表头取自后台「点检模板」配置，未配置时回退公司通用表头
  // v1.37.0：优先用服务端算好的 form_head（「后台表单页眉 > 模板自带 > 默认」已在服务端解析）
  const formHead=d.form_head||[d.form_code||'DEMO-QR-032', d.form_rev||'Rev.A1'].join(' ');
  const tblTitle=d.title||'设备维护保养记录';
  const tblTitleEn=d.title_en||'Maintenance Record of Equipment';
  const signers=(d.signers&&d.signers.length)?d.signers.join('、'):'—';
  const abn=(d.abnormal&&d.abnormal.length)?d.abnormal.join('； '):'—';

  f.innerHTML = `
    <div class="print-code">${esc(formHead)}</div>
    <div class="f-title">${esc(tblTitle)}<div class="en">${esc(tblTitleEn)}</div></div>
    <div class="f-head">
      <div class="fh-code">${esc(formHead)}</div>
      <span>年 <b class="yr">${yy}</b></span>
      <span>月 <b class="mo">${mm}</b></span>
      <span class="f-meta">
        <span>设备名称 Name of Equipments：<b>${esc(d.name)}</b></span>
        <span>型号 Model：<b>${esc(d.model)}</b></span>
        <span>编号 No.：<input class="no" value="${esc(d.no)}"></span>
      </span>
    </div>
    <table class="grid">
      <thead><tr>${head}</tr></thead>
      <tbody>${body}</tbody>
    </table>
    <div class="f-foot">
      <div class="row"><span class="lbl">维护人员 Maintainer：</span><span>${esc(signers)}</span></div>
      <div class="row"><span class="lbl">异常情况及处理记录：</span><span>${esc(abn)}</span></div>
      <div class="legend">备注 Note：维护状态为正常时，划“√”；异常时，划“×”。When the maintenance status is OK, mark √; when NOK, mark "×".</div>
    </div>`;
  return f;
}

$('#go').onclick = render;
$('#print').onclick = ()=>window.print();
$('#month').addEventListener('change', ()=>{ if($('#dev').value!=='') render(); });

initMonth();
loadDevices().then(render);
</script>

<script>
/* 演示站只读模式：可登录浏览，但一切写入被服务端拒绝；此处负责提示与隐藏入口 */
(function () {
  if (window.__READONLY_INJECTED__) return; window.__READONLY_INJECTED__ = true;
  function banner() {
    if (document.getElementById('ro-banner')) return;
    var bar = document.createElement('div');
    bar.id = 'ro-banner';
    bar.textContent = '演示站 · 只读展示模式：可登录后台浏览（账号 admin / admin123 或 demo-user / demo123），新增 / 编辑 / 删除等写入操作均已被禁用';
    // 贴顶固定（脱离文档流，不参与页面 flex 布局）+ 给 body 补 padding-top 让出高度：
    // 登录页 body 是 flex 居中，横幅若作为 flex 子项会被挤压错位；固定定位则永久不遮挡按钮。
    bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#2563eb;color:#fff;'
      + 'font-size:13px;line-height:1.7;padding:6px 12px;text-align:center;'
      + 'box-shadow:0 1px 4px rgba(0,0,0,.3);box-sizing:border-box';
    if (!document.getElementById('ro-banner-style')) {
      var st = document.createElement('style');
      st.id = 'ro-banner-style';
      // 粘性顶栏（旧版 .nav 与新版 .app-nav 两套）都要顺延到横幅下方，否则滚动时会被 fixed 横幅盖住。
      // 打印时横幅不显示，顶栏偏移与 body padding 一并复位。
      st.textContent = ':root{--ro-banner-h:0px}'
        + '.nav,.app-nav{top:var(--ro-banner-h,0px)!important}'
        + '@media print{#ro-banner{display:none!important}body{padding-top:0!important}'
        + '.nav,.app-nav{top:auto!important}}';
      (document.head || document.documentElement).appendChild(st);
    }
    var host = document.body || document.documentElement;
    host.appendChild(bar);
    function reserveTop() {
      var b = document.body; if (!b) return;
      b.style.boxSizing = 'border-box';
      b.style.paddingTop = ((bar.offsetHeight || 30) + 2) + 'px';
      // 同时把横幅高度写成 CSS 变量：页面的粘性顶栏（.nav / .app-nav）要把 top 顺延到横幅下方，
      // 否则滚动时顶栏会滑到 fixed 横幅底下被盖住。窄屏横幅可能换行成 2~3 行，高度是变化的，
      // 所以这里每次 resize 都更新（而不是写死一个值）。
      document.documentElement.style.setProperty('--ro-banner-h', (bar.offsetHeight || 30) + 'px');
    }
    reserveTop();
    window.addEventListener('resize', reserveTop);
    setTimeout(reserveTop, 300);
    setTimeout(reserveTop, 1200);
    setTimeout(reserveTop, 2500);
  }
  function hideWrites() {
    // 命中规则：按钮文字 **或** title 属性里出现写动词。title 也要看 —— 表格行内的
    // 「✕」删除按钮文字只有一个符号（如数据备份页签的目标行、局域网清单行），
    // 只能靠 title（"删掉这个目标" / "从清单移除"）识别出来。
    var verbs = ['新增','添加','删除','删','移除','编辑','保存','提交','导出','备份','恢复','签名','一键','批量','导入','升级','修改','新建','确认点检','整月生成','取消点检','自升级','远程','生成','测试'];
    document.querySelectorAll('button,a,.btn,.big').forEach(function (el) {
      if (el.classList.contains('nav-link') || el.classList.contains('brand')) return;
      var t = (el.textContent || '').replace(/\s+/g, '');
      var ti = (el.getAttribute('title') || '').replace(/\s+/g, '');
      if (verbs.some(function (v) { return t.indexOf(v) >= 0 || ti.indexOf(v) >= 0; })) el.style.display = 'none';
    });
  }
  if (document.readyState !== 'loading') { banner(); hideWrites(); }
  document.addEventListener('DOMContentLoaded', function () { banner(); hideWrites(); });
  setTimeout(hideWrites, 400); setTimeout(hideWrites, 1200); setTimeout(hideWrites, 2500);

  /* ⚠️ 只靠上面几个固定时刻调用**不够**：后台绝大部分按钮是「拿到接口数据后动态渲染」的
     （设备/房间/科室/模板/检查记录/用户… 每一行都有「编辑」「删除」，表单页签有成排的「保存」）。
     实测登录后逐个页签检查，固定时刻跑完之后页面上仍残留近百个可见写入口 —— 只能靠
     MutationObserver 监听后续渲染再补一次。观察 childList/subtree 而**不**观察 attributes：
     本函数自己会改 el.style.display，若观察 attributes 会自我触发形成循环。 */
  var _roPending = false;
  function scheduleHide() {
